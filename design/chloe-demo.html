<title>Демо-мозг Chloe</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap">
<style>
  :root { color-scheme: dark; }
  html, body {
    margin: 0;
    height: 100%;
    background: #0a0c0f;
    color: #aab2bd;
    font-family: system-ui, sans-serif;
  }
  #app {
    display: flex;
    flex-direction: column;
    height: 100%;
    max-width: 560px;
    margin: 0 auto;
    padding-block: 12px;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    box-sizing: border-box;
  }
  #micBtn { display: none; }
  header { display: flex; justify-content: space-between; align-items: center; font-size: 13px; }
  header b { color: #4682b4; font-weight: 500; }
  #dot {
    display: inline-block;
    width: 6px; height: 6px;
    border-radius: 50%;
    background: #4ade80;
    margin-right: 6px;
    transition: background .8s;
  }
  #stats { font-size: 12px; color: #7c8593; margin-top: 4px; }
  #stats span { color: #eef1f5; }

  #filters { display: flex; gap: 6px; overflow-x: auto; margin-top: 8px; padding-bottom: 2px; scrollbar-width: none; }
  #filters::-webkit-scrollbar { display: none; }
  .chip {
    flex: none;
    background: transparent;
    border: 1px solid #252b33;
    color: #7c8593;
    border-radius: 6px;
    padding: 4px 10px;
    font-size: 11px;
    cursor: pointer;
    white-space: nowrap;
  }
  .chip.on { border-color: #4682b4; color: #eef1f5; }

  #core {
    position: relative;
    flex: 1;
    min-height: 0;
    cursor: grab;
    touch-action: none;
    overflow: hidden;
  }
  #core.drag { cursor: grabbing; }
  #core canvas { display: block; width: 100%; height: 100%; }

  #search { position: absolute; top: 8px; left: 0; z-index: 2; display: flex; align-items: center; gap: 6px; }
  #search input {
    width: 150px;
    padding: 6px 10px;
    font-size: 12px;
    border-radius: 6px;
    background: rgba(17, 20, 25, 0.85);
  }
  #searchCount { font-size: 11px; color: #7c8593; }

  #zoom { position: absolute; top: 8px; right: 0; display: flex; flex-direction: column; gap: 6px; z-index: 2; }
  #zoom button {
    width: 30px; height: 30px;
    border-radius: 50%;
    background: rgba(17, 20, 25, 0.85);
    border: 1px solid #252b33;
    color: #7f9fc0;
    font-size: 16px;
    line-height: 1;
    cursor: pointer;
    padding: 0;
  }
  #zoom button:hover { border-color: #4682b4; color: #eef1f5; }
  #zoomLvl { font-size: 10px; text-align: center; color: #7c8593; }

  .label {
    position: absolute;
    transform: translate(-50%, -170%);
    font-size: 11px;
    letter-spacing: .02em;
    color: #e2e9f1;
    text-shadow: 0 0 6px rgba(70, 130, 180, .7), 0 0 2px #0a0c0f;
    white-space: nowrap;
    pointer-events: none;
    transition: opacity .8s;
  }
  .label.mem { color: #d3e0ee; text-shadow: 0 0 6px rgba(111, 147, 184, .7), 0 0 2px #0a0c0f; }
  .label.err { color: #ffd0d0; text-shadow: 0 0 6px rgba(255, 90, 90, .8), 0 0 2px #0a0c0f; }
  .label.think { color: #ffe9b8; text-shadow: 0 0 6px rgba(255, 210, 122, .8), 0 0 2px #0a0c0f; }
  .zone {
    position: absolute;
    transform: translate(-50%, -50%);
    font-size: 10px;
    letter-spacing: .12em;
    text-transform: uppercase;
    color: rgba(170, 178, 189, .55);
    white-space: nowrap;
    pointer-events: none;
  }

  .panel {
    position: absolute;
    left: 0; right: 0; bottom: 0;
    background: rgba(17, 20, 25, 0.97);
    border: 1px solid #252b33;
    border-radius: 8px;
    padding: 10px 12px;
    font-size: 12px;
    line-height: 1.6;
    display: none;
    z-index: 3;
    max-height: 100%;
    overflow-y: auto;
    box-sizing: border-box;
    cursor: default;
  }
  .panel b { color: #eef1f5; font-weight: 500; font-size: 13px; }
  .panel h4 { margin: 10px 0 4px; font-size: 11px; font-weight: 500; letter-spacing: .08em; text-transform: uppercase; color: #7c8593; }
  .panel .close { float: right; cursor: pointer; color: #7c8593; }
  .bar { display: inline-block; width: 80px; height: 4px; background: #1c2128; border-radius: 2px; vertical-align: middle; margin-left: 6px; }
  .bar i { display: block; height: 100%; background: #4682b4; border-radius: 2px; }
  .row { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  .row span:first-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .panel button.small {
    background: transparent; border: 1px solid #252b33; color: #aab2bd;
    border-radius: 6px; padding: 3px 10px; font-size: 11px; cursor: pointer; margin: 2px 4px 2px 0;
  }
  .panel button.small.on { border-color: #4682b4; color: #eef1f5; }
  .panel button.danger { border-color: #6b2a2a; color: #ffb3b3; }

  #eeg { margin-top: 6px; display: flex; flex-direction: column; gap: 2px; }
  #eegCanvas { width: 100%; height: 40px; display: block; }
  #eegInfo { display: flex; justify-content: space-between; gap: 8px; font-size: 10px; letter-spacing: .04em; color: #7c8593; }
  #eegInfo b { color: #7f9fc0; font-weight: 500; }
  .region {
    position: absolute; transform: translate(-50%, -50%);
    font-size: 9px; letter-spacing: .14em; text-transform: uppercase;
    color: rgba(170, 178, 189, .5); white-space: nowrap; pointer-events: none;
  }
  #reply { min-height: 18px; text-align: center; font-size: 13px; color: #e2e9f1; margin: 4px 0 2px; transition: opacity .6s; }

  #timeRow { display: flex; align-items: center; gap: 8px; font-size: 11px; color: #7c8593; margin: 2px 0 4px; }
  #timeRow input[type=range] { flex: 1; accent-color: #4682b4; padding: 0; border: none; background: none; }
  #timePlay {
    background: transparent; border: 1px solid #252b33; color: #7f9fc0;
    border-radius: 6px; padding: 3px 10px; font-size: 11px; cursor: pointer; white-space: nowrap;
  }
  #timeLabel { min-width: 74px; text-align: right; color: #aab2bd; }

  #bottom { display: flex; align-items: center; justify-content: space-between; margin: 4px 0 8px; gap: 8px; }
  #legend { display: flex; gap: 12px; font-size: 11px; color: #7c8593; }
  #legend i { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 5px; vertical-align: -1px; }
  #toggles { display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; }
  #toggles button {
    background: transparent; border: 1px solid #252b33; color: #7c8593;
    border-radius: 6px; padding: 4px 10px; font-size: 11px; cursor: pointer;
  }
  #toggles button.on { border-color: #4682b4; color: #eef1f5; }
  input {
    background: #111419;
    border: 1px solid #252b33;
    border-radius: 8px;
    padding: 11px 14px;
    font-size: 13px;
    color: #eef1f5;
    outline: none;
  }
  input::placeholder { color: #7c8593; }

  /* живые обои: только мозг */
  body.wall #app { max-width: none; padding: 0; }
  body.wall header, body.wall #stats, body.wall #filters, body.wall #reply,
  body.wall #timeRow, body.wall #eeg, body.wall #bottom, body.wall #cmd, body.wall #zoom, body.wall #search { display: none; }
  body.wall #core { cursor: default; }
  /* в программе микрофон и голос ведёт Python */
  body.app #micBtn, body.app #soundBtn { display: none; }
  #reply.heard { color: #7c8593; font-style: italic; }

  /* чистый вид: только сфера, имя и ответ; всё остальное — по кнопке ⋯ */
  #moreBtn { background: transparent; border: none; color: #7c8593; font-size: 16px; line-height: 1; cursor: pointer; padding: 0 0 0 10px; }
  #moreBtn:hover, #moreBtn.on { color: #eef1f5; }
  body.clean #stats, body.clean #filters, body.clean #search, body.clean #zoom,
  body.clean #eeg, body.clean #timeRow, body.clean #bottom, body.clean #cmd,
  body.clean .region, body.clean .zone { display: none !important; }
  body.clean #core { cursor: default; }

  /* стиль Claudia: тёмный, строгий, Steel Blue #4682b4 */
  html, body { font-family: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif; -webkit-font-smoothing: antialiased; }
  header { padding: 2px 0 10px; border-bottom: 1px solid #1c2128; font-size: 13px; }
  header b { color: #eef1f5; font-weight: 600; letter-spacing: -.01em; }
  header b::before { content: ""; display: inline-block; width: 8px; height: 8px; border-radius: 2px; background: #4682b4; margin-right: 8px; vertical-align: 0; }
  #stats { margin-top: 8px; }
  .chip, #toggles button, #timePlay, .panel button.small { border-radius: 6px; transition: background .15s, border-color .15s, color .15s; }
  .chip:hover, #toggles button:hover, #timePlay:hover { background: #161a20; color: #eef1f5; }
  .chip.on, #toggles button.on { background: rgba(70, 130, 180, .16); border-color: #4682b4; color: #eef1f5; }
  #zoom button { border-radius: 6px; }
  .panel { box-shadow: 0 12px 32px rgba(0,0,0,.45); }
  input:focus { border-color: #4682b4; box-shadow: 0 0 0 3px rgba(70,130,180,.18); }
  #cmd { border-radius: 8px; }
</style>
<div id="app">
  <header><b>Chloe · демо</b><span><i id="dot"></i><span id="statusTxt">онлайн</span><button id="moreBtn">⋯</button></span></header>
  <div id="stats">нейронов <span id="sN">0</span> · связей <span id="sL">0</span> · зон <span id="sZ">0</span> · сигналов <span id="sS">0</span></div>
  <div id="filters"></div>
  <div id="core">
    <div id="search"><input id="searchInput" placeholder="Поиск в мозге" autocomplete="off"><span id="searchCount"></span></div>
    <div id="zoom">
      <button id="zIn" title="Приблизить (+)">+</button>
      <button id="zOut" title="Отдалить (−)">−</button>
      <button id="zReset" title="Сбросить вид (0)">⟲</button>
      <div id="zoomLvl">100%</div>
    </div>
    <div id="info" class="panel"></div>
    <div id="statsPanel" class="panel"></div>
  </div>
  <div id="eeg">
    <canvas id="eegCanvas"></canvas>
    <div id="eegInfo"><span>ЭЭГ · <b id="eegRhythm">альфа · спокойствие</b></span><span>сосредоточенность <b id="focusTxt">0%</b> · усталость <b id="tiredTxt">0%</b></span></div>
  </div>
  <div id="reply"></div>
  <div id="timeRow">
    <button id="timePlay" title="Проиграть рост мозга">▶ Рост</button>
    <input id="timeSlider" type="range" min="0" max="1000" value="1000">
    <span id="timeLabel">сейчас</span>
  </div>
  <div id="bottom">
    <div id="legend"><span><i style="background:#4682b4"></i>навык</span><span><i style="background:#7f9fc0"></i>память</span></div>
    <div id="toggles">
      <button id="statsBtn">Статистика</button>
      <button id="wallBtn">Обои</button>
      <button id="micBtn">Микрофон</button>
      <button id="soundBtn">Звук</button>
    </div>
  </div>
  <input id="cmd" placeholder="Команда или «запомни …» — Chloe вырастит нейрон" autocomplete="off">
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function () {
  "use strict";

  // =======================================================
  // 0. ОСНОВА
  // =======================================================
  var params = new URLSearchParams(location.search);
  var APP = params.has("app");   // открыт внутри программы Chloe (Python): голос и действия идут оттуда
  if (APP) document.body.classList.add("app");
  var wrap = document.getElementById("core");
  var info = document.getElementById("info");
  var statsPanel = document.getElementById("statsPanel");
  var replyEl = document.getElementById("reply");

  var renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
  var DEVICE_DPR = window.devicePixelRatio || 1;
  var DPR = Math.min(DEVICE_DPR, 2);
  renderer.setPixelRatio(DPR);
  renderer.setClearColor(0x000000, 0);
  wrap.insertBefore(renderer.domElement, wrap.firstChild);

  var scene = new THREE.Scene();
  var FOV = 40;
  var camera = new THREE.PerspectiveCamera(FOV, 1, 0.02, 100);
  var BASE_Z = 4.9;
  camera.position.set(0, 0, BASE_Z);

  var group = new THREE.Group();
  scene.add(group);

  function rnd(a, b) { return a + Math.random() * (b - a); }
  function clamp(x, a, b) { return Math.min(Math.max(x, a), b); }
  function randDir(rng) {
    rng = rng || Math.random;
    var v = new THREE.Vector3(rng() * 2 - 1, rng() * 2 - 1, rng() * 2 - 1);
    if (v.lengthSq() < 1e-4) v.set(1, 0, 0);
    return v.normalize();
  }
  function gauss() { return (Math.random() + Math.random() + Math.random() - 1.5) / 1.5; }
  // предсказуемый генератор: один и тот же нейрон всегда растёт одинаково
  function seeded(seed) {
    var a = seed >>> 0;
    return function () {
      a = (a + 0x6D2B79F5) >>> 0;
      var t = a;
      t = Math.imul(t ^ (t >>> 15), t | 1);
      t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  var clock = new THREE.Clock();
  function now() { return clock.getElapsedTime(); }
  function approach(cur, target, rate, dt) { return cur + (target - cur) * Math.min(1, rate * dt); }
  function approachAngle(cur, target, rate, dt) {
    var d = target - cur;
    d = ((d + Math.PI) % (2 * Math.PI) + 2 * Math.PI) % (2 * Math.PI) - Math.PI;
    return cur + d * Math.min(1, rate * dt);
  }
  function escapeHtml(s) {
    return String(s).replace(/[&<>"]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]; });
  }

  var COLOR_SKILL = new THREE.Color(0x4682b4);
  var COLOR_MEM = new THREE.Color(0x6f93b8);
  var COLOR_HOT = new THREE.Color(0xeef4fa);
  var COLOR_ERR = new THREE.Color(0xff5a5a);
  var COLOR_GOLD = new THREE.Color(0xf0b85a);
  var COLOR_DREAM = new THREE.Color(0x8fa0c8);
  var COLOR_INH = new THREE.Color(0x7f86c4);
  var SIG_SKILL = new THREE.Color(0x4682b4).lerp(new THREE.Color(0xffffff), 0.3);
  var SIG_MEM = new THREE.Color(0x6f93b8).lerp(new THREE.Color(0xffffff), 0.3);
  var SHELL_BASE = new THREE.Color(0x4682b4);
  var SHELL_WARM = new THREE.Color(0xffb35c);
  var SHELL_COLD = new THREE.Color(0xff6a6a);
  var SHELL_SLEEP = new THREE.Color(0x4b5a8c);

  var MAX_N = 16384, MAX_L = 49152, AX = 12, DEND_MAX = 64, GROW = 2.6;   // максимум мозга

  function hash(x) { var s = Math.sin(x) * 43758.5453; return (s - Math.floor(s)) * 6.2831853; }
  function phases(id) { return [hash(id * 12.9898 + 1.0), hash(id * 78.233 + 2.0), hash(id * 39.425 + 3.0)]; }
  var GLSL_COMMON = [
    "float hsh(float x){ return fract(sin(x) * 43758.5453) * 6.2831853; }",
    "vec3 driftOf(float id, float t, float amp){",
    "  vec3 ph = vec3(hsh(id*12.9898+1.0), hsh(id*78.233+2.0), hsh(id*39.425+3.0));",
    "  return amp * vec3(sin(t*0.31+ph.x), sin(t*0.27+ph.y), sin(t*0.35+ph.z));",
    "}",
    "vec4 texAt(sampler2D tex, float id, float size){",
    "  vec2 uv = vec2(mod(id, size) + 0.5, floor(id / size) + 0.5) / size;",
    "  return texture2D(tex, uv);",
    "}",
    "float easeOut(float x){ x = clamp(x, 0.0, 1.0); return 1.0 - pow(1.0 - x, 3.0); }",
    // приглушение в толпе, которое исчезает при приближении
    "uniform float uCrowdK;",
    // при приближении на экран попадает меньше клеток — их можно делать ярче (пропорционально площади)
    "float crowdF(float lo, float dens, float zoom){ return min(1.0, mix(lo * uCrowdK, 1.0, smoothstep(0.3, 0.8, dens)) * (1.0 + (max(zoom, 1.0) - 1.0) * 0.6 * uCrowdK)); }",
    // поиск: найденные ярче, остальные гаснут
    "float searchF(float on, float hl){ return mix(1.0, mix(0.1, 1.5, hl), on); }"
  ].join("\n");
  var drift = { amp: 0.035 };
  function driftOf(id, t, out) {
    var ph = phases(id), a = drift.amp;
    return out.set(a * Math.sin(t * 0.31 + ph[0]), a * Math.sin(t * 0.27 + ph[1]), a * Math.sin(t * 0.35 + ph[2]));
  }

  // Состояние нейронов и связей хранится в текстурах, их читает видеокарта
  var NT = 128, LT = 256;   // 128×128 = 16384 нейрона, 256×256 = 65536 связей
  var neurData = new Float32Array(NT * NT * 4);   // сила, жар, рождение, тип
  var neur2Data = new Float32Array(NT * NT * 4);  // ошибка, найден, видимость, —
  var linkData = new Float32Array(LT * LT * 4);   // вес, свечение, рождение, мысль
  var link2Data = new Float32Array(LT * LT * 4);  // миелин, тормозящая, след активности, награда (дофамин)
  function dataTex(arr, size) {
    var t = new THREE.DataTexture(arr, size, size, THREE.RGBAFormat, THREE.FloatType);
    t.minFilter = t.magFilter = THREE.NearestFilter;
    t.needsUpdate = true;
    return t;
  }
  var neurTex = dataTex(neurData, NT), neur2Tex = dataTex(neur2Data, NT), linkTex = dataTex(linkData, LT), link2Tex = dataTex(link2Data, LT);
  // мембранный потенциал: покой 0, порог 1, после импульса — ниже покоя
  var vPot = new Float32Array(MAX_N), refUntil = new Float32Array(MAX_N);
  var NEURO = {
    threshold: 1.0,     // порог импульса
    reset: -0.35,       // гиперполяризация после импульса
    refractory: 0.5,    // секунд «отдыха» после импульса
    leak: 2.5,          // как быстро заряд стекает к покою
    synapse: 0.75,      // сколько заряда передаёт связь весом 1
    maxDepth: 3,        // как далеко расходится цепная реакция
    traceTau: 8         // сколько секунд связь «помнит», что работала (для дофамина)
  };

  var common = {
    uTime: { value: 0 }, uPixel: { value: DPR }, uProj: { value: 500 }, uScaleW: { value: 1 },
    uDens: { value: 1 }, uZoom: { value: 1 }, uDrift: { value: 0.035 },
    uSpeak: { value: 0 }, uChloe: { value: 0 }, uThink: { value: 0 }, uSleep: { value: 0 },
    uSearchOn: { value: 0 }, uBright: { value: 1 }, uCrowdK: { value: 1 }, uDeep: { value: 0 },
    uNeur: { value: neurTex }, uNeur2: { value: neur2Tex }, uLink: { value: linkTex }, uLink2: { value: link2Tex },
    uInh: { value: new THREE.Color(0x7f86c4) }, uWarm: { value: new THREE.Color(0xffc27a) },
    uSkill: { value: COLOR_SKILL }, uMem: { value: COLOR_MEM }, uHotC: { value: COLOR_HOT },
    uErrC: { value: COLOR_ERR }, uGold: { value: COLOR_GOLD }
  };

  // =======================================================
  // 1. СОСТОЯНИЯ И НАСТРОЕНИЕ
  // =======================================================
  var STATE = { name: "idle", since: 0 };
  var mood = { think: 0, speak: 0, listen: 0, sleep: 0 };
  var feel = { valence: 0, fatigue: 0 };   // + тепло (успех), − холод (ошибка); усталость 0..1
  var voice = { user: 0, chloe: 0 };
  var lastActivity = 0;
  var dot = document.getElementById("dot"), statusTxt = document.getElementById("statusTxt");
  function setState(name) {
    if (STATE.name === name) return;
    STATE.name = name;
    STATE.since = now();
    sound.state(name);
    statusTxt.textContent = name === "sleeping" ? "спит" : "онлайн";
    dot.style.background = name === "sleeping" ? "#4b5a8c" : "#4ade80";
  }
  function touch() {
    lastActivity = now();
    sensory = Math.min(1, sensory + 0.6);
    if (STATE.name === "sleeping") setState("idle");
  }

  // =======================================================
  // 2. ОБОЛОЧКА, ДЫМКА, ПЫЛИНКИ
  // =======================================================
  var SPH = 1.25, SN = 16000;
  var shellPos = new Float32Array(SN * 3), shellBr = new Float32Array(SN), shellSeed = new Float32Array(SN);
  var golden = Math.PI * (3 - Math.sqrt(5));
  (function () {
    // перемешанный порядок, чтобы при снижении качества точки редели равномерно
    var order = []; for (var i = 0; i < SN; i++) order.push(i);
    for (var k = SN - 1; k > 0; k--) { var j = Math.floor(Math.random() * (k + 1)); var tmp = order[k]; order[k] = order[j]; order[j] = tmp; }
    for (var m = 0; m < SN; m++) {
      var i2 = order[m];

  group.add(dendLines);

  var MAX_S = 800, TRAIL = 4;

  sigGeo.setDrawRange(0, 0);

      "  vec4 mv = modelViewMatrix * vec4(position, 1.0);",

  group.add(sigPoints);
  var signals = [];

  function density() { return clamp(1 / Math.cbrt(1 + nCount / 25), 0.2, 1); }

  function growDendrites(id, base, scale) {
    var rng = seeded(id * 7919 + 13);
    var segs = [];
    function branch(start, dir, len, depth, dist) {
      var p = start.clone(), d = dir.clone(), steps = 3;

  }

  // пространственная сетка: соседей ищем только в ближних ячейках, а не среди всех тысяч нейронов
  var CELL = 0.1, grid = {};

  function gridAdd(n) {
    var k = cellKey(Math.floor(n.base.x / CELL), Math.floor(n.base.y / CELL), Math.floor(n.base.z / CELL));

  }
  function around(p, r, out) {
    var cx = Math.floor(p.x / CELL), cy = Math.floor(p.y / CELL), cz = Math.floor(p.z / CELL);
    for (var x = cx - r; x <= cx + r; x++)
      for (var y = cy - r; y <= cy + r; y++)

  function nearest(p, k, skip) {

    return list.filter(function (n) { return n !== skip; })
      .sort(function (u, v) { return u.base.distanceToSquared(p) - v.base.distanceToSquared(p); })
      .slice(0, k);
  }

  // Отделы мозга, как в анатомии: ствол внизу в центре, над ним таламус (ворота для органов чувств),
  // гиппокамп (память), а снаружи — кора: лобная, моторная, височная, теменная, затылочная.
  var REGIONS = {
    stem:      { label: "ствол",           center: new THREE.Vector3(0, -0.6, -0.15), spread: 0.11 },
    thal:      { label: "таламус",         center: new THREE.Vector3(0, -0.08, 0),    spread: 0.12 },
    hippo:     { label: "гиппокамп",       center: new THREE.Vector3(0, -0.32, 0.12), spread: 0.17 },
    frontal:   { label: "лобная кора",     dir: new THREE.Vector3(0, 0.25, 1) },
    motor:     { label: "моторная кора",   dir: new THREE.Vector3(0, 1, 0.15) },
    temporalL: { label: "височная кора",   dir: new THREE.Vector3(-1, -0.25, 0.15) },
    temporalR: { label: "височная кора",   dir: new THREE.Vector3(1, -0.25, 0.15) },
    parietal:  { label: "теменная кора",   dir: new THREE.Vector3(0, 0.65, -0.75) },
    occipital: { label: "затылочная кора", dir: new THREE.Vector3(0, 0.05, -1) }
  };
  var SKILL_REGION = {
    "Система": "stem",
    "Голос": "thal", "Экран": "thal",                                   // органы чувств — через таламус
    "Мышь": "motor", "Клавиатура": "motor", "Горячие клавиши": "motor", "Прокрутка": "motor",
    "Программы": "frontal", "Команды": "frontal", "Файлы": "frontal", "Управление файлами": "frontal",
    "Сайты": "temporalL", "Загрузки": "temporalL", "Поиск в интернете": "temporalL",
    "Память": "hippo"
  };
  var CORTEX_FOR_ZONES = ["parietal", "temporalR", "occipital", "frontal", "motor", "temporalL"];
  function regionOf(name, type, zoneName) {
    if (SKILL_REGION[name]) return SKILL_REGION[name];
    if (type === "memory") return (zoneName === "Память" || !zoneName) ? "hippo" : CORTEX_FOR_ZONES[(zoneIndex[zoneName] || 0) % CORTEX_FOR_ZONES.length];

    return "frontal";                                                    // новые навыки учит лобная кора
  }
  function pickAnatomical(name, type, zone) {

    for (var k = 0; k < 14; k++) {
      var p;
      if (R.center) {
        p = new THREE.Vector3(gauss(), gauss(), gauss()).multiplyScalar(R.spread * (1 + Math.min(1.2, R.count / 150))).add(R.center);
      } else {
        // кора: тонкий слой у поверхности в своём секторе

  // связь; p1/p2 — изгиб (если не заданы, случайный); born — когда начала расти
  function connect(a, b, opt) {

    var id = lCount++;
    var dist = a.base.distanceTo(b.base);

    var base = opt.base || pickAnatomical(name, type, zone);

  function sendSignal(link, dir, depth, opt) {

    }
    dirty = true;
  }

  // Навык реально используется: клетка даёт импульс
  function fire(n, depth, quiet) {
    if (!n) return;
    var i = n.id * 4;
    n.uses++;
    neurData[i] = Math.min(HEBB.max, neurData[i] + HEBB.gain);
    n.labelUntil = Math.max(n.labelUntil, now() + 3);
    refUntil[n.id] = 0;
    spike(n, null, 1);
    if (!quiet) shellFlash(n.base);
    dirty = true;
    if (selected === n) showInfo(n);
  }

  // вспышка синапса на конце аксона
  var synFlashes = [];
  function synFlash(link, end, sg) {
    if (synFlashes.length > 300) synFlashes.shift();
    synFlashes.push({ link: link, end: end, born: now(), color: sg.color, alpha: sg.alpha });
  }

  // =======================================================
  // 6. ХОД МЫСЛЕЙ: цепочка шагов загорается золотом по очереди
  // =======================================================
  function findPath(from, to) {
    if (from === to) return [];
    var prev = {}; prev[from.id] = null;
    var queue = [from], t = now();
    while (queue.length) {
      var cur = queue.shift();
      for (var i = 0; i < cur.links.length; i++) {
        var l = cur.links[i];
        if (t - linkData[l.id * 4 + 2] < GROW) continue;
        var nx = l.a === cur ? l.b : l.a;
        if (prev[nx.id] !== undefined) continue;
        prev[nx.id] = { n: cur, l: l };
        if (nx === to) {
          var path = [], c = to;
          while (prev[c.id]) { path.unshift({ link: prev[c.id].l, dir: prev[c.id].l.a === prev[c.id].n ? 1 : -1, to: c }); c = prev[c.id].n; }
          return path;
        }
        queue.push(nx);
      }
    }
    return null;
  }

  var episodes = [];      // реальные цепочки мыслей за день — их мозг переигрывает во сне
  function think(steps, onDone) {
    var list = steps.map(function (s) { return typeof s === "string" ? findSkill(s) : s; }).filter(Boolean);
    if (!list.length) { if (onDone) onDone(); return; }
    if (list.length > 1) { episodes.push(list.slice()); if (episodes.length > 40) episodes.shift(); }
    var hops = [];
    for (var i = 0; i < list.length - 1; i++) {
      var path = findPath(list[i], list[i + 1]);
      if (path === null) {
        // пути нет — Chloe прокладывает новую связь
        var l = connect(list[i], list[i + 1], { born: now() - GROW });
        path = l ? [{ link: l, dir: l.a === list[i] ? 1 : -1, to: list[i + 1] }] : [];
      }
      hops = hops.concat(path);
    }
    function mark(n) {
      neurData[n.id * 4 + 1] = 1;
      neurData[n.id * 4] = Math.min(HEBB.max, neurData[n.id * 4] + HEBB.gain * 0.5);
      vPot[n.id] = NEURO.reset;
      refUntil[n.id] = now() + NEURO.refractory;
      n.labelUntil = now() + 3.5;
      n.labelKind = "think";
      n.uses++;
    }
    mark(list[0]);
    var idx = 0;
    function nextHop() {
      if (idx >= hops.length) { if (onDone) onDone(); return; }
      var h = hops[idx++];
      var hl = h.link.id * 4;
      linkData[hl + 3] = 1;
      sendSignal(h.link, h.dir, NEURO.maxDepth, {
        speed: 1.3, color: COLOR_GOLD, alpha: 1, kind: "thought",
        onArrive: function () {
          // путь мысли — рабочий путь: связь крепнет, обрастает миелином, помнит работу
          linkData[hl] = Math.min(HEBB.linkMax, linkData[hl] + HEBB.linkGain * 1.5);
          link2Data[hl] = Math.min(1, link2Data[hl] + 0.05);
          link2Data[hl + 2] = 1;
          if (list.indexOf(h.to) >= 0) mark(h.to); else { neurData[h.to.id * 4 + 1] = Math.max(neurData[h.to.id * 4 + 1], 0.6); }
          nextHop();
        }
      });
    }
    nextHop();
    dirty = true;
  }

  // =======================================================
  // 7. ОШИБКИ И НАСТРОЕНИЕ
  // =======================================================
  function error(n, why) {
    if (!n) return;
    n.errors++;
    neur2Data[n.id * 4] = 1;
    n.labelUntil = now() + 4;
    n.labelKind = "err";
    feel.valence = -1;
    sound.error();
    // учится на ошибке: связи, которые только что работали, слабеют,
    // а та, что привела к ошибке, становится тормозящей — в следующий раз она гасит этот путь
    var culprit = null;
    for (var j = 0; j < lCount; j++) {
      var tr = link2Data[j * 4 + 2];
      if (tr < 0.05) continue;
      linkData[j * 4] = Math.max(HEBB.linkMin, linkData[j * 4] - 0.3 * tr);
    }
    n.links.forEach(function (l) { if (!culprit || link2Data[l.id * 4 + 2] > link2Data[culprit.id * 4 + 2]) culprit = l; });
    if (culprit && link2Data[culprit.id * 4 + 2] > 0.05) link2Data[culprit.id * 4 + 1] = 1;
    var pool = neurons.filter(function (m) { return m !== n && m.type === "skill" && !linkBetween(n, m) && neur2Data[m.id * 4 + 2] > 0.5; });
    if (pool.length) {
      pool.sort(function (u, v) { return u.base.distanceToSquared(n.base) - v.base.distanceToSquared(n.base); });
      var partner = pool[Math.floor(Math.random() * Math.min(4, pool.length))];
      setTimeout(function () { connect(n, partner); }, 900);
    }
    n.lastError = why || "";
    dirty = true;
    if (selected === n) showInfo(n);
  }
  // Успех: дофамин. Связи, работавшие последние секунды (у них есть след), получают награду.
  function success() {
    feel.valence = Math.max(feel.valence, 0.9);
    sound.success();
    for (var j = 0; j < lCount; j++) {
      var tr = link2Data[j * 4 + 2];
      if (tr < 0.05) continue;
      linkData[j * 4] = Math.min(HEBB.linkMax, linkData[j * 4] + 0.35 * tr);
      link2Data[j * 4] = Math.min(1, link2Data[j * 4] + 0.05 * tr);
      link2Data[j * 4 + 1] = 0;          // успешный путь больше не тормозящий
      link2Data[j * 4 + 3] = tr;         // тёплое свечение награды
    }
    dirty = true;
  }

  // =======================================================

  var START = [
    ["Голос", "Слышит речь и отвечает голосом", ["голос", "скажи", "слышишь"]],

    ["Клавиатура", "Печатает текст", ["напиши", "напечатай", "введи"]],
    ["Горячие клавиши", "Нажимает сочетания клавиш: копировать, вставить, Enter", ["клавиш", "сочетан", "скопируй", "вставь", "enter"]],
    ["Прокрутка", "Прокручивает страницу вверх и вниз", ["прокрут", "листай", "вниз", "вверх"]],

  var KEYWORDS = {};

  var STORE_KEY = "chloe-brain-v1";
  function r3(x) { return Math.round(x * 1000) / 1000; }
  function save() {
    if (!dirty) return;
    dirty = false;
    try {
      var data = {
        v: 2,
        zones: zones.map(function (z) { return z.name; }),
        neurons: neurons.map(function (n) {
          return [n.name, n.type === "memory" ? 1 : 0, n.desc, zoneIndex[n.zone], r3(n.base.x), r3(n.base.y), r3(n.base.z),
            n.bornMs, n.uses, r3(neurData[n.id * 4]), n.errors, r3(n.dendScale)];
        }),
        links: links.map(function (l) {
          return [l.a.id, l.b.id, r3(linkData[l.id * 4]), r3(link2Data[l.id * 4]), link2Data[l.id * 4 + 1] > 0.5 ? 1 : 0];
        })
      };
      storeSet(JSON.stringify(data));
    } catch (e) { /* хранилище недоступно — работаем без сохранения */ }
  }
  // в программе мозг хранится в файле через Python, в браузере — в localStorage
  function storeSet(str) {
    if (APP && window.pywebview && window.pywebview.api) { window.pywebview.api.save_brain(str); return; }
    try { localStorage.setItem(STORE_KEY, str); } catch (e) {}
  }
  function storeGet(cb) {
    if (!APP) { var raw = null; try { raw = localStorage.getItem(STORE_KEY); } catch (e) {} cb(raw); return; }
    var done = false;
    function fromApi() {
      if (done) return; done = true;
      window.pywebview.api.load_brain().then(function (raw) { cb(raw || null); }, function () { cb(null); });
    }
    if (window.pywebview && window.pywebview.api) fromApi();
    else window.addEventListener("pywebviewready", fromApi);
    setTimeout(function () {          // открыт с ?app=1 в обычном браузере — работаем без Python
      if (done) return; done = true;
      var raw = null; try { raw = localStorage.getItem(STORE_KEY); } catch (e) {} cb(raw);
    }, 4000);
  }
  function load(raw) {
    if (!raw) return false;
    try {
      var data = JSON.parse(raw);
      data.zones.forEach(function (z) { getZone(z); });
      data.neurons.forEach(function (a) {
        createNeuron(a[0], a[1] ? "memory" : "skill", a[2], data.zones[a[3]], {
          base: (data.v || 1) >= 2 ? new THREE.Vector3(a[4], a[5], a[6]) : null, bornMs: a[7], uses: a[8], strength: a[9], errors: a[10] || 0,
          dendScale: a[11] || 1, grown: true
        });
      });
      data.links.forEach(function (a) {
        if (!neurons[a[0]] || !neurons[a[1]]) return;
        var old = a.length === 9;   // самый старый формат хранил изгиб связи
        var opt = { weight: old ? a[8] : a[2], born: -100, myelin: old ? 0 : (a[3] || 0), inhib: !old && a[4] === 1 };
        if (old) { opt.p1 = new THREE.Vector3(a[2], a[3], a[4]); opt.p2 = new THREE.Vector3(a[5], a[6], a[7]); }
        connect(neurons[a[0]], neurons[a[1]], opt);
      });
      dirty = false;
      return nCount > 0;
    } catch (e) { return false; }
  }
  setInterval(save, 4000);
  window.addEventListener("beforeunload", save);
  document.addEventListener("visibilitychange", function () { if (document.hidden) save(); });

  function findSkill(text) {
    var low = String(text).toLowerCase();
    var i, n;
    for (i = 0; i < nCount; i++) { n = neurons[i]; if (low === n.name.toLowerCase()) return n; }
    for (i = 0; i < nCount; i++) {
      n = neurons[i];
      if (low.indexOf(n.name.toLowerCase()) >= 0) return n;
      var kw = KEYWORDS[n.name] || [];
      for (var k = 0; k < kw.length; k++) if (low.indexOf(kw[k]) >= 0) return n;
    }
    return null;
  }
  function shortName(s) { return s.length > 26 ? s.slice(0, 25) + "…" : s; }

  // =======================================================
  // 9. ОТВЕТ CHLOE (демонстрация, пока не подключена Python-часть)
  // =======================================================
  var replyTimer = null;
  function respond(text, onThink, afterSpeak) {
    setState("thinking");
    replyEl.style.opacity = 0;
    clearTimeout(replyTimer);
    replyTimer = setTimeout(function () {
      var go = function () { speak(text, afterSpeak); };
      if (onThink) onThink(go); else go();
    }, 900);
  }
  function speak(text, after) {
    setState("speaking");
    replyEl.textContent = text;
    replyEl.style.opacity = 1;
    var done = function () {
      voice.chloe = 0;
      setState("idle");
      if (after) after();
      setTimeout(function () { if (STATE.name !== "speaking") replyEl.style.opacity = 0; }, 2500);
    };
    if (sound.isOn() && window.speechSynthesis) {
      var u = new SpeechSynthesisUtterance(text);
      u.lang = "ru-RU";
      u.onend = done;
      u.onerror = done;
      speechSynthesis.cancel();
      speechSynthesis.speak(u);
    } else {
      setTimeout(done, 900 + text.length * 55);
    }
  }

  var cmd = document.getElementById("cmd");
  cmd.addEventListener("keydown", function (e) {
    if (e.key !== "Enter") return;
    var text = cmd.value.trim();
    cmd.value = "";
    if (!text) return;
    touch();
    if (APP && window.pywebview && window.pywebview.api) { window.pywebview.api.command(text); return; }
    var m = text.match(/^(запомни|запомнить|помни|научись|навык)[:,\s]+(.+)$/i);
    if (m) {
      var isSkill = /^(научись|навык)/i.test(m[1]);
      var n = addNeuron(shortName(m[2]), isSkill ? "skill" : "memory", (isSkill ? "Новый навык: " : "Воспоминание: ") + m[2]);
      respond(isSkill ? "Учусь: " + m[2] : "Запомнила.", function (go) {
        setTimeout(function () { fire(n); go(); }, 1200);
      }, success);
      return;
    }
    var hit = findSkill(text);
    var failed = /ошибк|не получ|сломай/i.test(text);
    if (hit) {
      // план: посмотреть на экран → нужный навык → действие мышью
      var plan = ["Экран", hit.name, "Мышь"].filter(function (s, i, a) { return a.indexOf(s) === i; });
      respond(failed ? "Не получилось. Попробую по-другому." : "Готово. Использую навык «" + hit.name + "».", function (go) {
        think(plan, function () {
          if (failed) error(hit, text);
          go();
        });
      }, failed ? null : success);
    } else {
      var nn = addNeuron(shortName(text), "skill", "Выучено из задачи: " + text, "Навыки");
      respond("Это новое для меня. Учусь.", function (go) {
        setTimeout(function () { think(["Экран", nn], go); }, 1500);
      }, success);
    }
  });

  // =======================================================
  // 10. МИКРОФОН И ЗВУК
  // =======================================================
  var mic = { on: false, analyser: null, data: null, stream: null, lastLoud: 0 };
  var micBtn = document.getElementById("micBtn");
  micBtn.onclick = function () {
    touch();
    if (mic.on) {
      mic.stream.getTracks().forEach(function (tr) { tr.stop(); });
      mic.on = false; voice.user = 0;
      micBtn.classList.remove("on");
      if (STATE.name === "listening") setState("idle");
      return;
    }
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
      replyEl.textContent = "Микрофон недоступен в этом браузере."; replyEl.style.opacity = 1; return;
    }
    navigator.mediaDevices.getUserMedia({ audio: true }).then(function (stream) {
      var ac = new (window.AudioContext || window.webkitAudioContext)();
      var src = ac.createMediaStreamSource(stream);
      var an = ac.createAnalyser();
      an.fftSize = 512;
      src.connect(an);
      mic.analyser = an; mic.data = new Uint8Array(an.fftSize); mic.stream = stream; mic.on = true;
      micBtn.classList.add("on");
    }).catch(function () { replyEl.textContent = "Нет доступа к микрофону."; replyEl.style.opacity = 1; });
  };
  function readMic(t) {
    if (!mic.on) return;
    mic.analyser.getByteTimeDomainData(mic.data);
    var sum = 0;
    for (var i = 0; i < mic.data.length; i++) { var v = (mic.data[i] - 128) / 128; sum += v * v; }
    var lvl = clamp((Math.sqrt(sum / mic.data.length) - 0.02) * 8, 0, 1);
    voice.user += (lvl - voice.user) * 0.35;
    if (lvl > 0.15) {
      mic.lastLoud = t; touch();
      if (STATE.name === "idle") setState("listening");
    } else if (STATE.name === "listening" && t - mic.lastLoud > 1.2) setState("idle");
  }
  var soundBtn = document.getElementById("soundBtn");
  soundBtn.onclick = function () { touch(); soundBtn.classList.toggle("on", sound.toggle()); };

  // =======================================================
  // 11. ВРАЩЕНИЕ, МАСШТАБ, ПОЛЁТ К НЕЙРОНУ
  // =======================================================
  var rot = { x: 0.2, y: 0, vx: 0, vy: 0 };
  var view = { zoom: 1, panX: 0, panY: 0, focus: null };

  var dragging = false, panning = false, moved = 0, lx = 0, ly = 0;
  var pointers = {}, pinch = null;
  var el = renderer.domElement;

  function camZ(zoom) { return BASE_Z * (0.2 + 0.8 * group.scale.x) / zoom; }
  function halfH(zoom) { return camZ(zoom) * Math.tan(FOV * Math.PI / 360); }
  function clampPan() {
    var lim = SPH * group.scale.x * 1.1;
    view.panX = clamp(view.panX, -lim, lim);
    view.panY = clamp(view.panY, -lim, lim);
  }
  function zoomAt(factor, sx, sy) {
    var w = wrap.clientWidth, h = wrap.clientHeight;
    var nx = sx === undefined ? 0 : (sx / w) * 2 - 1;
    var ny = sy === undefined ? 0 : 1 - (sy / h) * 2;
    var aspect = w / h;
    var z0 = view.zoom, z1 = clamp(z0 * factor, ZOOM_MIN, ZOOM_MAX);
    var wx = view.panX + nx * halfH(z0) * aspect, wy = view.panY + ny * halfH(z0);
    view.zoom = z1;
    view.panX = wx - nx * halfH(z1) * aspect;
    view.panY = wy - ny * halfH(z1);
    clampPan();
  }
  function panBy(dxPx, dyPx) {
    var k = 2 * halfH(view.zoom) / wrap.clientHeight;
    view.panX -= dxPx * k;
    view.panY += dyPx * k;
    clampPan();
  }
  function resetView() { view.zoom = 1; view.panX = 0; view.panY = 0; view.focus = null; }

  // Полёт: развернуть мозг так, чтобы нейроны оказались перед камерой, и приблизиться
  function focusOn(list) {
    if (!list || !list.length) return;
    var c = new THREE.Vector3();
    list.forEach(function (n) { c.add(n.base); });
    c.multiplyScalar(1 / list.length);
    var spread = 0;
    list.forEach(function (n) { spread = Math.max(spread, n.base.distanceTo(c)); });
    var yaw = Math.atan2(-c.x, c.z);
    var r = Math.sqrt(c.x * c.x + c.z * c.z);
    var pitch = Math.atan2(c.y, r);
    var depth = c.length() * group.scale.x;
    var dist = Math.max(0.9, spread * group.scale.x * 2.8);
    view.focus = { yaw: yaw, pitch: pitch };
    view.zoom = clamp(camZ(1) / (depth + dist), ZOOM_MIN, ZOOM_MAX);
    view.panX = 0; view.panY = 0;
  }

  el.addEventListener("wheel", function (e) {
    e.preventDefault(); touch();
    var rect = el.getBoundingClientRect();
    var d = e.deltaMode === 1 ? e.deltaY * 30 : e.deltaY;
    zoomAt(Math.exp(-d * 0.0015), e.clientX - rect.left, e.clientY - rect.top);
  }, { passive: false });
  el.addEventListener("contextmenu", function (e) { e.preventDefault(); });
  document.getElementById("zIn").onclick = function () { touch(); zoomAt(1.4); };
  document.getElementById("zOut").onclick = function () { touch(); zoomAt(1 / 1.4); };
  document.getElementById("zReset").onclick = function () { touch(); resetView(); };
  window.addEventListener("keydown", function (e) {
    touch();
    if (e.key === "Escape") { setWall(false); clearSearch(); return; }
    if (document.activeElement && document.activeElement.tagName === "INPUT") return;
    if (e.key === "+" || e.key === "=") zoomAt(1.4);
    else if (e.key === "-" || e.key === "_") zoomAt(1 / 1.4);

  el.addEventListener("pointerdown", function (e) {
    touch();
    pointers[e.pointerId] = { x: e.clientX, y: e.clientY };
    el.setPointerCapture && el.setPointerCapture(e.pointerId);
    var ids = Object.keys(pointers);
    if (ids.length === 2) {
      var a = pointers[ids[0]], b = pointers[ids[1]];
      pinch = { d: Math.hypot(a.x - b.x, a.y - b.y), mx: (a.x + b.x) / 2, my: (a.y + b.y) / 2 };
      dragging = false; moved = 99;
      return;
    }
    dragging = true; moved = 0; lx = e.clientX; ly = e.clientY; rot.vx = 0; rot.vy = 0;

  });
  el.addEventListener("pointermove", function (e) {
    if (pointers[e.pointerId]) { pointers[e.pointerId].x = e.clientX; pointers[e.pointerId].y = e.clientY; }

      var d = Math.hypot(a.x - b.x, a.y - b.y);

    }
    if (!dragging) return;
    var dx = e.clientX - lx, dy = e.clientY - ly;
    moved += Math.abs(dx) + Math.abs(dy);

    if (panning) { panBy(dx, dy); return; }

  // =======================================================
  // 17. СОН: в долгом покое Chloe переигрывает воспоминания
  // =======================================================
  // Весы сна и бодрствования. В бодрствовании копится «давление сна» (как аденозин), работа добавляет его быстрее.
  // Сигналы от органов чувств (голос, команды) питают центр бодрствования (глутамат).
  // Когда давление сна перевешивает — центр сна (ГАМК) выключает бодрствование, и Chloe засыпает.
  var SLEEP_RATE = +(params.get("sleepRate") || 1);
  var sleepP = 0, sensory = 0.6;
  // Стадии сна по кругу, как в лаборатории сна: дремота → лёгкий → глубокий → лёгкий → быстрый сон → …
  var STAGE_INFO = {
    N1:  { name: "дремота",      sec: 8 },
    N2:  { name: "лёгкий сон",   sec: 12 },
    N3:  { name: "глубокий сон", sec: 18 },
    REM: { name: "быстрый сон",  sec: 12 }
  };
  var STAGE_ORDER = ["N1", "N2", "N3", "N2", "REM", "N2", "N3", "N2", "REM"];
  var stage = { key: "", idx: 0, until: 0 }, nextSpindle = 0, nextReplay = 0;

  function setStage(key, t) {
    stage.key = key;
    stage.until = t + STAGE_INFO[key].sec / Math.max(0.2, SLEEP_RATE);
    statusTxt.textContent = "спит · " + STAGE_INFO[key].name;
  }
  function fallAsleep(t) {
    setState("sleeping");
    stage.idx = 0;
    setStage(STAGE_ORDER[0], t);
  }
  function sleepTick(t, dt) {
    var hour = new Date().getHours();
    var night = (hour >= 1 && hour < 6) ? 2 : 1;      // ночью давление сна растёт быстрее
    var asleep = STATE.name === "sleeping";
    if (!asleep) {
      var busy = STATE.name === "thinking" || STATE.name === "speaking";
      sleepP = clamp(sleepP + dt * SLEEP_RATE * night * (0.0025 + (busy ? 0.004 : 0) + eeg.rate * 0.0003), 0, 1);
    } else {
      sleepP = clamp(sleepP - dt * SLEEP_RATE * (stage.key === "N3" ? 0.005 : 0.002), 0, 1);   // глубокий сон восстанавливает быстрее
    }
    sensory = Math.max(0, sensory - dt * 0.08);
    var wakeDrive = 0.25 + sensory;
    if (!asleep && STATE.name === "idle" && nCount && !playing && sleepP > wakeDrive + 0.15) fallAsleep(t);
    // просыпается, когда к ней обратились (органы чувств) или когда полностью отдохнула
    else if (asleep && (sensory > 0.3 || sleepP < 0.03)) { stage.key = ""; setState("idle"); }
    if (STATE.name !== "sleeping") return;

    if (t > stage.until) { stage.idx = (stage.idx + 1) % STAGE_ORDER.length; setStage(STAGE_ORDER[stage.idx], t); }
    // лёгкий сон: «сонные веретёна» — короткие вспышки таламуса
    if (stage.key === "N2" && t > nextSpindle) {
      neurons.forEach(function (n) { if (regionOf(n.name, n.type, n.zone) === "thal") neurData[n.id * 4 + 1] = Math.max(neurData[n.id * 4 + 1], 0.3); });
      eeg.spindle = 1;
      nextSpindle = t + rnd(3, 5);
    }
    // быстрый сон: мозг переигрывает реальные цепочки мыслей за день и закрепляет их
    if (stage.key === "REM" && episodes.length && t > nextReplay) {
      replay(episodes[Math.floor(Math.random() * episodes.length)]);
      nextReplay = t + 3.5;
    }
  }
  function replay(list) {
    var hops = [];
    for (var i = 0; i < list.length - 1; i++) { var path = findPath(list[i], list[i + 1]); if (path) hops = hops.concat(path); }
    var idx = 0;
    function next() {
      if (idx >= hops.length || STATE.name !== "sleeping") return;
      var h = hops[idx++], hl = h.link.id * 4;
      sendSignal(h.link, h.dir, NEURO.maxDepth, {
        speed: 0.5, color: COLOR_DREAM, alpha: 0.7, kind: "dream",
        onArrive: function () {
          linkData[hl] = Math.min(HEBB.linkMax, linkData[hl] + 0.03);          // консолидация памяти
          neurData[h.to.id * 4 + 1] = Math.max(neurData[h.to.id * 4 + 1], 0.35);
          next();
        }
      });
    }
    if (list[0]) neurData[list[0].id * 4 + 1] = Math.max(neurData[list[0].id * 4 + 1], 0.35);
    next();
  }

  // ЭЭГ: линия строится из настоящих импульсов мозга и его состояния, как на записи в лаборатории
  var eeg = { buf: new Float32Array(1200), pos: 0, kick: 0, spikes: 0, rate: 0, spindle: 0, focus: 0, ph: 0, lastSec: 0, rhythm: "" };
  var eegCanvas = document.getElementById("eegCanvas"), eegCtx = eegCanvas.getContext("2d");
  var eegRhythm = document.getElementById("eegRhythm"), focusTxt = document.getElementById("focusTxt"), tiredTxt = document.getElementById("tiredTxt");
  function eegTick(t, dt) {
    if (t - eeg.lastSec >= 1) {                       // частота импульсов в секунду
      eeg.rate = eeg.rate * 0.5 + eeg.spikes * 0.5;
      eeg.spikes = 0; eeg.lastSec = t;
    }
    var asleep = STATE.name === "sleeping";
    var working = STATE.name === "thinking" || STATE.name === "speaking";
    var thoughtActive = signals.some(function (s) { return s.kind === "thought"; });
    var focusT = asleep ? 0 : clamp(eeg.rate / 8 + (working ? 0.35 : 0) + (thoughtActive ? 0.35 : 0), 0, 1);
    eeg.focus = approach(eeg.focus, focusT, 1.5, dt);
    // амплитуды ритмов
    var sk = stage.key;
    var aAlpha = !asleep && !working ? 0.3 * (1 - eeg.focus) : 0;
    var aBeta = !asleep ? 0.08 + 0.3 * eeg.focus : 0;
    var aTheta = asleep ? (sk === "REM" ? 0.35 : sk === "N1" ? 0.3 : sk === "N2" ? 0.22 : 0.05) : 0;
    var aDelta = asleep ? (sk === "N3" ? 0.95 : sk === "N2" ? 0.2 : 0) : 0;
    eeg.spindle = Math.max(0, eeg.spindle - dt * 1.2);
    var n = Math.max(1, Math.round(dt * 240));
    for (var i = 0; i < n; i++) {
      eeg.ph += 1 / 240;
      var p = eeg.ph * Math.PI * 2;
      var v = aAlpha * Math.sin(p * 10) * (0.7 + 0.3 * Math.sin(p * 0.6))
            + aBeta * (Math.sin(p * 21) * 0.6 + Math.sin(p * 27 + 1) * 0.4)
            + aTheta * Math.sin(p * 6)
            + aDelta * Math.sin(p * 1.1) * (0.8 + 0.2 * Math.sin(p * 0.3))
            + eeg.spindle * 0.4 * Math.sin(p * 13)
            + (Math.random() - 0.5) * 0.06
            + eeg.kick * (Math.random() - 0.3);
      eeg.kick *= 0.9;
      eeg.buf[eeg.pos] = v;
      eeg.pos = (eeg.pos + 1) % eeg.buf.length;
    }
    var rhythm = asleep ? { N1: "тета · дремота", N2: "веретёна · лёгкий сон", N3: "дельта · глубокий сон", REM: "тета · быстрый сон" }[sk] || "сон"
               : working || eeg.focus > 0.4 ? "бета · работа" : "альфа · спокойствие";
    if (rhythm !== eeg.rhythm) { eeg.rhythm = rhythm; eegRhythm.textContent = rhythm; }
    focusTxt.textContent = Math.round(eeg.focus * 100) + "%";
    tiredTxt.textContent = Math.round(sleepP * 100) + "%";
    drawEeg(asleep);
  }
  function drawEeg(asleep) {
    var w = eegCanvas.clientWidth, h = eegCanvas.clientHeight;
    if (!w || document.body.classList.contains("wall")) return;
    var dpr = Math.min(DEVICE_DPR, 2);
    if (eegCanvas.width !== Math.round(w * dpr)) { eegCanvas.width = Math.round(w * dpr); eegCanvas.height = Math.round(h * dpr); }
    var c = eegCtx;
    c.setTransform(dpr, 0, 0, dpr, 0, 0);
    c.clearRect(0, 0, w, h);
    c.strokeStyle = "rgba(37, 43, 51, 0.6)"; c.lineWidth = 1;
    c.beginPath(); c.moveTo(0, h / 2); c.lineTo(w, h / 2); c.stroke();
    c.strokeStyle = asleep ? "rgba(143, 160, 200, 0.85)" : "rgba(70, 130, 180, 0.85)";
    c.lineWidth = 1.2;
    c.beginPath();
    var N = eeg.buf.length;
    for (var x = 0; x <= w; x++) {
      var idx = (eeg.pos + Math.floor(x / w * (N - 1))) % N;
      var y = h / 2 - clamp(eeg.buf[idx], -1.3, 1.3) * h * 0.36;
      if (x === 0) c.moveTo(x, y); else c.lineTo(x, y);
    }
    c.stroke();
  }

  var quality = { level: 2, auto: true, fps: 60, frames: 0, acc: 0, low: 0, high: 0 };
  var Q_NAMES = { high: 2, medium: 1, low: 0 };

  function setQuality(level) {

  function trackQuality(frameMs) {
    quality.frames++; quality.acc += frameMs;
    if (quality.acc < 1000) return;
    quality.fps = quality.frames * 1000 / quality.acc;
    quality.frames = 0; quality.acc = 0;
    if (!quality.auto || document.hidden) return;
    if (quality.fps < 35) { quality.low++; quality.high = 0; } else if (quality.fps > 55) { quality.high++; quality.low = 0; } else { quality.low = 0; quality.high = 0; }
    if (quality.low >= 3 && quality.level > 0) { setQuality(quality.level - 1); quality.low = 0; }
    if (quality.high >= 8 && quality.level < 2) { setQuality(quality.level + 1); quality.high = 0; }
  }

  var nextIdle = 3, nextThink = 0, last = 0, tw = 0;
  var tmpP = new THREE.Vector3(), tmpC = new THREE.Color();
  var zoomLvl = document.getElementById("zoomLvl");
  var lastFrame = performance.now();

  function animate() {
    requestAnimationFrame(animate);
    var nowMs = performance.now();
    trackQuality(nowMs - lastFrame);
    lastFrame = nowMs;
    var t = now();
    var dt = Math.min(t - last, 0.05);
    last = t;

    readMic(t);
    sleepTick(t, dt);
    eegTick(t, dt);
    updatePlay();

    mood.think = approach(mood.think, STATE.name === "thinking" ? 1 : 0, 3, dt);
    mood.speak = approach(mood.speak, STATE.name === "speaking" ? 1 : 0, 3, dt);
    mood.listen = approach(mood.listen, STATE.name === "listening" ? 1 : 0, 4, dt);
    mood.sleep = approach(mood.sleep, STATE.name === "sleeping" ? 1 : 0, 0.6, dt);
    common.uDeep.value = approach(common.uDeep.value, STATE.name === "sleeping" && stage.key === "N3" ? 1 : 0, 0.8, dt);

    // настроение: тепло/холод уходит, усталость копится в работе
    feel.valence = approach(feel.valence, 0, 0.35, dt);
    var busy = STATE.name === "thinking" || STATE.name === "speaking";
    feel.fatigue = clamp(feel.fatigue + (busy ? 0.03 : (STATE.name === "sleeping" ? -0.05 : -0.008)) * dt + signals.length * 0.00002 * dt, 0, 1);
    tmpC.copy(SHELL_BASE);
    if (feel.valence > 0) tmpC.lerp(SHELL_WARM, feel.valence * 0.75);
    else tmpC.lerp(SHELL_COLD, -feel.valence * 0.8);
    tmpC.lerp(SHELL_SLEEP, mood.sleep * 0.7);
    shellUniforms.uBase.value.copy(tmpC);
    shellUniforms.uHot.value.copy(tmpC).lerp(COLOR_HOT, 0.35);   // свет волны — того же оттенка, что и сфера
    common.uBright.value = 1 - 0.4 * feel.fatigue - 0.35 * mood.sleep;
    tw += dt * (1 - 0.6 * feel.fatigue - 0.6 * mood.sleep);
    shellUniforms.uTw.value = tw;

    if (STATE.name === "speaking") {
      var syl = 0.5 + 0.5 * Math.sin(t * 13) * Math.sin(t * 5.3 + 1);
      voice.chloe = approach(voice.chloe, 0.35 + 0.65 * syl, 12, dt);
      if (t > nextWave) { emitWave(t); nextWave = t + 0.45 - 0.2 * voice.chloe; }
    }

    // мозг растёт вместе с опытом; камера
    var sc = approach(group.scale.x, brainScale(), 0.8, dt);
    group.scale.setScalar(sc);
    camera.position.z = approach(camera.position.z, camZ(view.zoom), view.focus ? 3 : 7, dt);
    camera.position.x = approach(camera.position.x, view.panX, 7, dt);
    camera.position.y = approach(camera.position.y, view.panY, 7, dt);
    zoomLvl.textContent = Math.round(view.zoom * 100) + "%";
    common.uZoom.value = camZ(1) / Math.max(camera.position.z, 0.05);
    common.uScaleW.value = sc;
    common.uDens.value = approach(common.uDens.value, density(), 0.8, dt);
    // чем больше клеток, тем прозрачнее каждая — чтобы тысячи не сливались в пятно
    common.uCrowdK.value = approach(common.uCrowdK.value, Math.min(1, Math.pow(800 / Math.max(nCount, 1), 0.82)), 0.8, dt);

    // вращение
    if (view.focus) {
      rot.y = approachAngle(rot.y, view.focus.yaw, 2.5, dt);
      rot.x = approach(rot.x, view.focus.pitch, 2.5, dt);
    } else if (!dragging) {
      rot.y += rot.vy; rot.x += rot.vx; rot.vy *= 0.95; rot.vx *= 0.95;
      rot.y += dt * (0.08 + 0.05 * mood.think) * (1 - 0.7 * mood.sleep);
    }
    group.rotation.set(rot.x, rot.y, 0);
    group.updateMatrixWorld();

    drift.amp = 0.035 * (1 + 0.6 * mood.think) * (1 - 0.5 * mood.sleep) * (0.6 + 0.4 * common.uDens.value);
    common.uDrift.value = drift.amp;

    // нейроны: угасание, остывание, видимость (фильтр + машина времени), ошибки гаснут
    for (var i = 0; i < nCount; i++) {
      var o4 = i * 4, n = neurons[i];
      neurData[o4] = Math.max(HEBB.min, neurData[o4] - HEBB.decay * dt);
      neurData[o4 + 1] = Math.max(0, neurData[o4 + 1] - dt * 0.9);
      neur2Data[o4] = Math.max(0, neur2Data[o4] - dt * 0.25);
      vPot[i] += (0 - vPot[i]) * Math.min(1, NEURO.leak * dt);      // заряд стекает к покою
      neur2Data[o4 + 3] = vPot[i];
      var visT = (filterVisible(n) && n.bornMs <= timeCut) ? 1 : 0;
      neur2Data[o4 + 2] = approach(neur2Data[o4 + 2], visT, 4, dt);
    }
    for (var j = 0; j < lCount; j++) {
      var l4 = j * 4;
      linkData[l4] = Math.max(HEBB.linkMin, linkData[l4] - HEBB.linkDecay * dt);
      linkData[l4 + 1] = Math.max(0, linkData[l4 + 1] - dt * 1.5);
      linkData[l4 + 3] = Math.max(0, linkData[l4 + 3] - dt * 0.35);
      link2Data[l4] = Math.max(0, link2Data[l4] - 0.0003 * dt);              // миелин держится долго
      link2Data[l4 + 2] *= Math.exp(-dt / NEURO.traceTau);                    // след работы
      link2Data[l4 + 3] = Math.max(0, link2Data[l4 + 3] - dt * 0.6);         // свечение награды
    }

    // сигналы
    for (var s = signals.length - 1; s >= 0; s--) {
      var sg = signals[s];
      sg.t += sg.dir * sg.speed * dt / sg.link.len;
      linkData[sg.link.id * 4 + 1] = Math.max(linkData[sg.link.id * 4 + 1], 0.8 * sg.alpha);
      if (sg.t >= 1 || sg.t <= 0) {
        signals.splice(s, 1);
        deliver(sg);
        if (sg.onArrive) sg.onArrive();
      }
    }
    var cnt = 0;
    for (var q = 0; q < signals.length; q++) {
      var sq = signals[q];
      for (var tr = 0; tr < TRAIL; tr++) {
        var tt = clamp(sq.t - sq.dir * tr * 0.016, 0, 1);
        linkPoint(sq.link, tt, t, tmpP);
        sigPos[cnt * 3] = tmpP.x; sigPos[cnt * 3 + 1] = tmpP.y; sigPos[cnt * 3 + 2] = tmpP.z;
        sigA[cnt] = 0.85 * (1 - tr / TRAIL) * sq.alpha;
        sigCol[cnt * 3] = sq.color.r; sigCol[cnt * 3 + 1] = sq.color.g; sigCol[cnt * 3 + 2] = sq.color.b;
        cnt++;
      }
    }
    // вспышки синапсов: короткое свечение на конце аксона в момент передачи
    for (var sf = synFlashes.length - 1; sf >= 0; sf--) {
      var fl = synFlashes[sf], age = t - fl.born;
      if (age > 0.45) { synFlashes.splice(sf, 1); continue; }
      if (cnt >= MAX_S * TRAIL) break;
      linkPoint(fl.link, fl.end ? 0.97 : 0.03, t, tmpP);
      sigPos[cnt * 3] = tmpP.x; sigPos[cnt * 3 + 1] = tmpP.y; sigPos[cnt * 3 + 2] = tmpP.z;
      sigA[cnt] = (1 - age / 0.45) * fl.alpha;
      sigCol[cnt * 3] = fl.color.r; sigCol[cnt * 3 + 1] = fl.color.g; sigCol[cnt * 3 + 2] = fl.color.b;
      cnt++;
    }
    sigGeo.attributes.position.needsUpdate = true;
    sigGeo.attributes.aA.needsUpdate = true;
    sigGeo.attributes.aCol.needsUpdate = true;
    sigGeo.setDrawRange(0, cnt);

    // Свет только от настоящей работы: случайных вспышек в покое, при размышлении и во сне нет.

    neurTex.needsUpdate = true;
    neur2Tex.needsUpdate = true;
    linkTex.needsUpdate = true;
    link2Tex.needsUpdate = true;

    haze.forEach(function (h) {
      var u = h.userData;
      h.position.set(
        u.base.x + 0.12 * Math.sin(t * 0.07 + u.ph),
        u.base.y + 0.1 * Math.sin(t * 0.05 + u.ph * 2),
        u.base.z + 0.12 * Math.sin(t * 0.06 + u.ph * 3)
      );
      h.material.opacity = u.op * (1 + 0.8 * mood.think + 0.6 * mood.speak) * common.uBright.value;
    });

    updateLabels(t);
    document.getElementById("sN").textContent = nCount;
    document.getElementById("sL").textContent = lCount;
    document.getElementById("sZ").textContent = zones.length;
    document.getElementById("sS").textContent = signals.length;

    common.uTime.value = t;
    common.uSpeak.value = mood.speak;
    common.uChloe.value = voice.chloe;
    common.uThink.value = mood.think;
    common.uSleep.value = mood.sleep;
    shellUniforms.uEnergy.value = 0.3 + 0.35 * mood.think + 0.15 * mood.speak - 0.15 * mood.sleep;
    shellUniforms.uListen.value = voice.user * (0.4 + 0.6 * mood.listen);
    renderer.render(scene, camera);
  }

    while (made < 1400 && guard++ < 20000) {
      var z = zonesM[made % zonesM.length], L = DEMO_MEM[z];
      var nm = L.a[Math.floor(Math.random() * L.a.length)] + " " + L.b[Math.floor(Math.random() * L.b.length)];
      if (seen[nm]) nm += " (" + (2 + Math.floor(Math.random() * 30)) + ")";
      if (seen[nm]) continue;
      seen[nm] = 1;
      if (add(nm, "memory", z)) made++;
    }
    for (var i = 0; i < lCount; i++) linkData[i * 4 + 2] = -100;   // все связи уже выросли
    // натренированные пути: частые задачи — сильные связи в миелине
    DEMO_TASKS.forEach(function (task, k) {
      var reps = 6 + (DEMO_TASKS.length - k) * 3;
      var list = task.path.map(findSkill).filter(Boolean);
      for (var j = 0; j < list.length - 1; j++) {
        var path = findPath(list[j], list[j + 1]);
        if (!path) { var l = connect(list[j], list[j + 1], { born: -100 }); path = l ? [{ link: l }] : []; }
        path.forEach(function (h) {
          var li = h.link.id * 4;
          linkData[li] = Math.min(HEBB.linkMax, linkData[li] + 0.06 * reps);
          link2Data[li] = Math.min(1, link2Data[li] + 0.02 * reps);
        });
      }
      episodes.push(list);
    });
    // несколько тормозящих связей — пути, которые когда-то привели к ошибке
    for (var q = 0; q < 25; q++) link2Data[Math.floor(Math.random() * lCount) * 4 + 1] = 1;
    dirty = true;
  }
  var demoTimer = null;
  function demoLoop() {
    clearTimeout(demoTimer);
    demoTimer = setTimeout(function () {
      if (STATE.name === "idle" && !playing) {
        var task = DEMO_TASKS[Math.floor(Math.random() * DEMO_TASKS.length)];
        var fail = Math.random() < 0.12;
        replyEl.classList.add("heard"); replyEl.textContent = "Пример задачи: " + task.text; replyEl.style.opacity = 1;
        sensory = Math.min(1, sensory + 0.6);
        setState("thinking");
        think(task.path, function () {
          if (fail) { error(findSkill(task.path[task.path.length - 1]), "пример ошибки (демо)"); }
          else success();
          setState("idle");
          setTimeout(function () { if (STATE.name === "idle") replyEl.style.opacity = 0; }, 2500);
        });
      }
      demoLoop();
    }, rnd(6000, 9000));
  }

  // ---------- запуск ----------
  rebuildFilters();
  if (quality.auto) resize(); else setQuality(quality.level);
  if (params.has("wallpaper")) setWall(true);
  animate();
  storeGet(function (raw) {
    var loaded = load(raw);
    var missing = START.filter(function (s) { return !neurons.some(function (n) { return n.name === s[0]; }); });
    if (!loaded) missing = [];
    missing.forEach(function (s, i) {
      setTimeout(function () { addNeuron(s[0], "skill", s[1], "Компьютер"); }, 300 + i * (loaded ? 900 : 700));
    });
    window.chloeReady = true;
    if (nCount < 200) buildDemo();
    demoLoop();
  });
})();
</script>

<script>
(function () {
  var KEY = "chloe-clean-view", btn = document.getElementById("moreBtn");
  function get() { try { return localStorage.getItem(KEY) !== "0"; } catch (e) { return true; } }
  function set(on) {
    document.body.classList.toggle("clean", on);
    btn.classList.toggle("on", !on);
    btn.title = on ? "Показать все функции" : "Скрыть лишнее";
    try { localStorage.setItem(KEY, on ? "1" : "0"); } catch (e) {}
    window.dispatchEvent(new Event("resize"));
  }
  btn.onclick = function () { set(!document.body.classList.contains("clean")); };
  set(get());
})();
</script>
