<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chloe Brain</title>
<style>
  html, body {
    margin: 0;
    height: 100%;
    background: #04101a;
    color: #8fb5c9;
    font-family: system-ui, sans-serif;
  }
  #app {
    display: flex;
    flex-direction: column;
    height: 100%;
    max-width: 520px;
    margin: 0 auto;
    padding: 12px;
    box-sizing: border-box;
  }
  header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 13px;
  }
  header b { color: #4fd1ff; font-weight: 500; }
  header i {
    display: inline-block;
    width: 6px; height: 6px;
    border-radius: 50%;
    background: #3ddc97;
    margin-right: 6px;
  }
  #core {
    flex: 1;
    min-height: 0;
    cursor: grab;
    touch-action: pan-y;
  }
  #core.drag { cursor: grabbing; }
  #core canvas { display: block; width: 100%; height: 100%; }
  input {
    background: #071a28;
    border: 1px solid #164a66;
    border-radius: 8px;
    padding: 11px 14px;
    font-size: 13px;
    color: #dff6ff;
    outline: none;
  }
  input::placeholder { color: #5a8aa3; }
</style>
</head>
<body>
<div id="app">
  <header><b>Chloe</b><span><i></i>онлайн</span></header>
  <div id="core"></div>
  <input id="cmd" placeholder="Скажите «Хлоя» или напишите команду…" autocomplete="off">
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function () {
  var wrap = document.getElementById("core");

  var renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
  var DPR = Math.min(window.devicePixelRatio || 1, 2);
  renderer.setPixelRatio(DPR);
  renderer.setClearColor(0x000000, 0);
  wrap.appendChild(renderer.domElement);

  var scene = new THREE.Scene();
  var camera = new THREE.PerspectiveCamera(40, 1, 0.1, 100);
  camera.position.set(0, 0, 4.3);

  var group = new THREE.Group();
  scene.add(group);

  function rnd(a, b) { return a + Math.random() * (b - a); }

  // -------------------------------------------------------
  // ИЗВИЛИНЫ: волновой "шум", его нулевые линии = борозды
  // -------------------------------------------------------
  function makeFolds(count, freq) {
    var waves = [];
    for (var i = 0; i < count; i++) {
      var d = new THREE.Vector3(rnd(-1, 1), rnd(-1, 1), rnd(-1, 1)).normalize();
      waves.push({ d: d.multiplyScalar(freq * rnd(0.8, 1.25)), ph: rnd(0, Math.PI * 2) });
    }
    return function (p) {
      var s = 0;
      for (var i = 0; i < waves.length; i++) {
        s += Math.sin(p.x * waves[i].d.x + p.y * waves[i].d.y + p.z * waves[i].d.z + waves[i].ph);
      }
      return s / Math.sqrt(waves.length);
    };
  }
  var cortexFolds = makeFolds(8, 6.0);

  // -------------------------------------------------------
  // ФОРМА МОЗГА: два полушария, мозжечок, ствол
  // -------------------------------------------------------
  var pos = [], bright = [], seed = [];

  function pushPoint(p, b) {
    pos.push(p.x, p.y, p.z);
    bright.push(b);
    seed.push(Math.random());
  }

  // точка на поверхности одного полушария (side = -1 левое, +1 правое)
  function hemispherePoint(side) {
    var v = new THREE.Vector3(rnd(-1, 1), rnd(-1, 1), rnd(-1, 1));
    if (v.lengthSq() < 1e-4) v.set(1, 0, 0);
    v.normalize();
    v.x = Math.abs(v.x);                       // внешняя половина полушария

    var p = new THREE.Vector3(v.x * 0.78, v.y * 0.86, v.z * 1.18);

    if (p.y < 0) p.y *= 0.62;                  // плоское основание
    p.x *= 1 - 0.18 * Math.max(0, p.y);        // сужение к макушке
    if (p.z > 0.5) p.y *= 1 - 0.2 * (p.z - 0.5); // лоб чуть ниже

    // височная доля: выпуклость снизу сбоку
    var temporal = Math.exp(-Math.pow((p.y + 0.38) / 0.22, 2)) * Math.exp(-Math.pow((p.z - 0.15) / 0.55, 2));
    p.x += 0.12 * temporal * v.x;
    p.y -= 0.06 * temporal;

    // извилины: лёгкий рельеф по нормали
    var f = cortexFolds(p);
    var n = p.clone().normalize();
    p.add(n.multiplyScalar(0.05 * Math.tanh(f * 1.6)));

    p.x = side * (p.x + 0.045);                // межполушарная щель
    return { p: p, f: f };
  }

  var CORTEX = 24000;
  var made = 0;
  while (made < CORTEX) {
    var side = made % 2 === 0 ? -1 : 1;
    var h = hemispherePoint(side);
    var fold = Math.abs(h.f);
    // в бороздах точек меньше и они темнее
    if (fold < 0.42 && Math.random() < 0.97) continue;
    var b = 0.5 + 0.5 * Math.min(1, (fold - 0.42) / 0.8);
    pushPoint(h.p, b);
    made++;
  }

  // мозжечок: снизу сзади, с частыми горизонтальными бороздками
  for (var c = 0; c < 4000; c++) {
    var v2 = new THREE.Vector3(rnd(-1, 1), rnd(-1, 1), rnd(-1, 1)).normalize();
    var cp = new THREE.Vector3(v2.x * 0.62, v2.y * 0.28, v2.z * 0.36);
    cp.add(new THREE.Vector3(0, -0.58, -0.78));
    var stripe = Math.abs(Math.sin(cp.y * 46 + cp.z * 8));
    if (stripe < 0.3 && Math.random() < 0.8) continue;
    pushPoint(cp, 0.3 + 0.5 * stripe);
  }

  // ствол мозга
  for (var s2 = 0; s2 < 700; s2++) {
    var a = rnd(0, Math.PI * 2);
    var t = rnd(0, 1);
    var rad = 0.15 - 0.04 * t;
    pushPoint(new THREE.Vector3(Math.cos(a) * rad, -0.45 - t * 0.6, -0.32 - t * 0.12 + Math.sin(a) * rad * 0.8), 0.35);
  }

  // редкие точки внутри — ощущение объёма
  for (var k = 0; k < 900; k++) {
    var side2 = Math.random() < 0.5 ? -1 : 1;
    var hp = hemispherePoint(side2).p.multiplyScalar(rnd(0.2, 0.85));
    pushPoint(hp, 0.12);
  }

  var geo = new THREE.BufferGeometry();
  geo.setAttribute("position", new THREE.Float32BufferAttribute(pos, 3));
  geo.setAttribute("aBright", new THREE.Float32BufferAttribute(bright, 1));
  geo.setAttribute("aSeed", new THREE.Float32BufferAttribute(seed, 1));

  // -------------------------------------------------------
  // ВСПЫШКИ АКТИВНОСТИ: волна расходится от точки на коре
  // -------------------------------------------------------
  var FLASHES = 5;
  var flashData = [];
  for (var fI = 0; fI < FLASHES; fI++) flashData.push(new THREE.Vector4(0, 0, 0, -100));

  var uniforms = {
    uTime: { value: 0 },
    uPixel: { value: DPR },
    uFlash: { value: flashData },
    uBase: { value: new THREE.Color(0x2fa9dc) },
    uHot: { value: new THREE.Color(0xe8fbff) }
  };

  var material = new THREE.ShaderMaterial({
    uniforms: uniforms,
    transparent: true,
    depthWrite: false,
    blending: THREE.AdditiveBlending,
    vertexShader: [
      "uniform float uTime;",
      "uniform float uPixel;",
      "uniform vec4 uFlash[" + FLASHES + "];",
      "attribute float aBright;",
      "attribute float aSeed;",
      "varying float vBright;",
      "varying float vHot;",
      "void main() {",
      "  float hot = 0.0;",
      "  for (int i = 0; i < " + FLASHES + "; i++) {",
      "    float age = uTime - uFlash[i].w;",
      "    if (age > 0.0 && age < 2.2) {",
      "      float d = distance(position, uFlash[i].xyz);",
      "      float front = age * 0.75;",
      "      float ring = exp(-pow((d - front) / 0.07, 2.0));",
      "      float spot = exp(-pow(d / 0.12, 2.0)) * exp(-age * 3.0);",
      "      hot += (ring * 0.9 + spot) * (1.0 - age / 2.2);",
      "    }",
      "  }",
      "  float twinkle = 0.75 + 0.25 * sin(uTime * (1.0 + aSeed * 2.0) + aSeed * 40.0);",
      "  vBright = aBright * twinkle;",
      "  vHot = clamp(hot, 0.0, 1.0);",
      "  vec4 mv = modelViewMatrix * vec4(position, 1.0);",
      "  gl_PointSize = (2.3 + 3.0 * vHot) * uPixel * (4.5 / -mv.z);",
      "  gl_Position = projectionMatrix * mv;",
      "}"
    ].join("\n"),
    fragmentShader: [
      "uniform vec3 uBase;",
      "uniform vec3 uHot;",
      "varying float vBright;",
      "varying float vHot;",
      "void main() {",
      "  vec2 c = gl_PointCoord - 0.5;",
      "  float r = length(c);",
      "  if (r > 0.5) discard;",
      "  float soft = smoothstep(0.5, 0.0, r);",
      "  vec3 col = mix(uBase, uHot, vHot);",
      "  float a = soft * (vBright * 0.95 + vHot);",
      "  gl_FragColor = vec4(col * a, a);",
      "}"
    ].join("\n")
  });

  var brain = new THREE.Points(geo, material);
  group.add(brain);

  // новая вспышка в случайной точке коры
  var nextFlash = 0, flashIndex = 0;
  function spawnFlash(t) {
    var i = Math.floor(Math.random() * CORTEX);
    flashData[flashIndex].set(pos[i * 3], pos[i * 3 + 1], pos[i * 3 + 2], t);
    flashIndex = (flashIndex + 1) % FLASHES;
  }

  // -------------------------------------------------------
  // РАЗМЕР
  // -------------------------------------------------------
  function resize() {
    var w = Math.max(wrap.clientWidth, 1);
    var hgt = Math.max(wrap.clientHeight, 1);
    renderer.setSize(w, hgt, false);
    camera.aspect = w / hgt;
    camera.position.z = w / hgt < 0.8 ? 5.3 : 4.4;
    camera.updateProjectionMatrix();
  }
  window.addEventListener("resize", resize);
  resize();

  // -------------------------------------------------------
  // УПРАВЛЕНИЕ ПАЛЬЦЕМ И МЫШЬЮ + ИНЕРЦИЯ
  // -------------------------------------------------------
  var dragging = false, lx = 0, ly = 0, offY = 0, offX = 0, vY = 0, vX = 0;
  var el = renderer.domElement;

  el.addEventListener("pointerdown", function (e) {
    dragging = true; lx = e.clientX; ly = e.clientY; vY = 0; vX = 0;
    wrap.classList.add("drag");
    el.setPointerCapture && el.setPointerCapture(e.pointerId);
  });
  window.addEventListener("pointerup", function () {
    dragging = false;
    wrap.classList.remove("drag");
  });
  el.addEventListener("pointermove", function (e) {
    if (!dragging) return;
    vY = (e.clientX - lx) * 0.008;
    vX = (e.clientY - ly) * 0.008;
    lx = e.clientX; ly = e.clientY;
    offY += vY; offX += vX;
  });

  // -------------------------------------------------------
  // АНИМАЦИЯ
  // -------------------------------------------------------
  var clock = new THREE.Clock();

  function animate() {
    requestAnimationFrame(animate);
    var time = clock.getElapsedTime();

    if (!dragging) {
      offY += vY; offX += vX;
      vY *= 0.95; vX *= 0.95;
    }

    group.rotation.y = -1.25 + Math.sin(time * 0.25) * 0.7 + offY;
    group.rotation.x = 0.1 + offX;

    if (time > nextFlash) {
      spawnFlash(time);
      nextFlash = time + rnd(0.35, 0.9);
    }

    uniforms.uTime.value = time;
    renderer.render(scene, camera);
  }
  animate();
})();
</script>
</body>
</html>
