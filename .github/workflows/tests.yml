# Тесты Chloe при каждой отправке кода: поломка не пройдёт незамеченной.
# Ключи не нужны: тесты подменяют модели и работают во временной домашней папке.
name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unittest:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Системные библиотеки (микрофон, экран без монитора)
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q portaudio19-dev xvfb xdotool espeak-ng
      - name: Зависимости
        run: |
          python -m pip install -q --upgrade pip
          pip install -q -r requirements.txt
      - name: Тесты (только так: -t . — иначе тесты тронули бы настоящую ~/.chloe)
        run: xvfb-run -a python -m unittest discover -s tests -t . < /dev/null
