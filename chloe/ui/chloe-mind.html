<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0A0A0A">
<title>Chloe</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500&family=Inter:wght@400;500&display=swap">
<style>
  /* Chloe · стиль Channel Studio: монохромная «тёмная студия» + один коралловый акцент.
     Мозг — на весь экран, всё остальное лежит поверх него тонкими слоями. */
  :root {
    --bg: #0A0A0A;      /* угольный чёрный */
    --ink: #F2F2F2;     /* главный текст */
    --bone: #CACACA;    /* текст, тонкие линии */
    --iron: #8A8A8A;    /* подписи (светлее #727272 — читается мелким текстом) */
    --line: #2A2A2A;    /* волосяные линии */
    --coral: #FF7777;   /* единственный цвет: мысль, внимание, «сейчас» */
    --err: #E05555;
    --font: "Inter Tight", "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--bone); font-family: var(--font);
    -webkit-font-smoothing: antialiased; overflow: hidden; }
  button { font-family: var(--font); }
  ::selection { background: var(--coral); color: var(--bg); }

  #app { position: fixed; inset: 0; }

  /* --- мозг: весь экран --- */
  #core { position: absolute; inset: 0; cursor: grab; touch-action: none; overflow: hidden; }
  #core.drag { cursor: grabbing; }
  #core canvas { display: block; width: 100%; height: 100%; }

  /* --- шапка --- */
  header { position: absolute; left: 0; right: 0; top: 0; height: 64px; z-index: 5; display: flex; align-items: center;
    justify-content: space-between; padding: 0 40px; border-bottom: 1px solid var(--line); background: rgba(10,10,10,.82);
    backdrop-filter: blur(8px); font-size: 14px; pointer-events: auto; }
  header b { color: var(--ink); font-weight: 500; font-size: 20px; letter-spacing: -.03em; }
  header > span { display: flex; align-items: center; gap: 10px; color: var(--bone); }
  #dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--coral); transition: background .8s; }
  #statusTxt { letter-spacing: -.01em; }
  /* постоянное зрение: что Chloe сейчас видит на экране */
  #seeBtn { display: inline-flex; align-items: center; gap: 8px; max-width: 320px; background: transparent; border: 0; border-left: 1px solid var(--line);
    margin-left: 18px; padding: 0 0 0 18px; min-height: 36px; color: var(--iron); font-size: 14px; letter-spacing: -.01em; cursor: pointer; }
  #seeBtn[hidden] { display: none; }
  #spendBtn { background: transparent; border: 0; border-left: 1px solid var(--line); padding: 0 0 0 10px; color: var(--iron);
    font: inherit; letter-spacing: -.01em; cursor: pointer; font-variant-numeric: tabular-nums; }
  #spendBtn:hover, #spendBtn:focus-visible { color: var(--ink); outline: none; }
  #spendBtn[hidden] { display: none; }
  #seeBtn:hover { color: var(--ink); }
  #seeTxt { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #seeEye { flex: none; width: 14px; height: 9px; border: 1px solid currentColor; border-radius: 50% / 60%; position: relative; }
  #seeEye::after { content: ""; position: absolute; left: 50%; top: 50%; width: 4px; height: 4px; margin: -2px 0 0 -2px; border-radius: 50%; background: currentColor; }
  #seeBtn.on { color: var(--bone); }
  #seeBtn.on #seeEye { color: var(--coral); }
  #seeBtn.private #seeEye::before { content: ""; position: absolute; left: -3px; right: -3px; top: 50%; height: 1px; background: currentColor; transform: rotate(-20deg); }
  #seeBtn.off { color: var(--iron); }
  #seeBtn.off #seeEye::before { content: ""; position: absolute; left: -3px; right: -3px; top: 50%; height: 1px; background: currentColor; transform: rotate(-20deg); }
  #moreBtn { background: transparent; border: 0; border-bottom: 1px solid var(--line); color: var(--bone); font-size: 14px;
    padding: 6px 0; margin-left: 28px; min-height: 36px; cursor: pointer; letter-spacing: -.01em; }
  #moreBtn::after { content: " →"; }
  #moreBtn:hover, #moreBtn.on { color: var(--coral); border-color: var(--coral); }

  /* --- цифры и фильтры: левый верх --- */
  #stats { position: absolute; left: 40px; top: 88px; z-index: 4; font-size: 11px; letter-spacing: .14em; text-transform: uppercase;
    color: var(--iron); pointer-events: none; }
  #stats span { color: var(--ink); letter-spacing: -.01em; font-size: 13px; font-variant-numeric: tabular-nums; }
  #filters { position: absolute; left: 40px; top: 116px; right: 480px; z-index: 4; display: flex; flex-wrap: wrap; gap: 4px 22px; }
  .chip { flex: none; background: transparent; border: 0; border-bottom: 1px solid transparent; color: var(--iron);
    padding: 4px 0; font-size: 14px; letter-spacing: -.01em; cursor: pointer; white-space: nowrap; transition: color .15s, border-color .15s; }
  .chip:hover { color: var(--ink); }
  .chip.on { color: var(--ink); border-bottom-color: var(--coral); }

  #search { position: absolute; left: 40px; top: 160px; z-index: 4; display: flex; align-items: center; gap: 10px; }
  #search input { width: 220px; padding: 8px 0; font-size: 14px; }
  #searchCount { font-size: 12px; color: var(--iron); }

  /* --- масштаб: справа по центру --- */
  #zoom { position: absolute; right: 40px; top: 50%; transform: translateY(-50%); z-index: 4; display: flex; flex-direction: column; gap: 0;
    border: 1px solid var(--line); background: rgba(10,10,10,.6); }
  #zoom button { width: 44px; height: 44px; background: transparent; border: 0; border-bottom: 1px solid var(--line); color: var(--bone);
    font-size: 18px; line-height: 1; cursor: pointer; padding: 0; }
  #zoom button:hover { color: var(--coral); }
  #zoomLvl { font-size: 11px; text-align: center; color: var(--iron); padding: 8px 0; font-variant-numeric: tabular-nums; }

  /* --- подписи нейронов и зон в 3D --- */
  .label { position: absolute; transform: translate(-50%, -170%); font-size: 12px; letter-spacing: -.01em; color: var(--ink);
    text-shadow: 0 0 3px var(--bg), 0 0 8px var(--bg); white-space: nowrap; pointer-events: none; transition: opacity .8s; }
  .label.mem { color: var(--bone); }
  .label.err { color: var(--err); }
  .label.recall { color: #FFC2C2; }
  .label.think { color: var(--coral); }
  .zone, .region { position: absolute; transform: translate(-50%, -50%); font-size: 10px; letter-spacing: .18em; text-transform: uppercase;
    color: rgba(202,202,202,.42); white-space: nowrap; pointer-events: none; }
  .region { font-size: 9px; color: rgba(202,202,202,.32); }
  /* центр управления: отделы мозга, слои и ядро — кнопки, открывают слой системы */
  .region, .layer, #coreLabel { pointer-events: auto; cursor: pointer; background: transparent; border: 0; padding: 8px 10px;
    font-family: var(--font); transition: color .15s, opacity .4s; }
  .region:hover, .region:focus-visible { color: var(--ink); outline: none; }
  .layer { position: absolute; transform: translate(-50%, -50%); font-size: 10px; letter-spacing: .14em; text-transform: uppercase;
    color: rgba(202,202,202,.55); white-space: nowrap; }
  .layer:hover, .layer:focus-visible { color: var(--coral); outline: none; }
  .layer.hot { color: var(--coral); }
  #coreLabel { position: absolute; transform: translate(-50%, 0); font-size: 11px; letter-spacing: .16em; text-transform: uppercase;
    color: var(--coral); white-space: nowrap; }
  #coreLabel:hover, #coreLabel:focus-visible { color: var(--ink); outline: none; }
  body.wall .layer, body.wall #coreLabel, body.wall .region { display: none; }
  /* панель ядра */
  .cRow { display: flex; justify-content: space-between; gap: 12px; padding: 7px 0; border-bottom: 1px solid #161616; }
  .cRow span:first-child { color: var(--iron); }
  .cRow span:last-child { color: var(--ink); text-align: right; overflow-wrap: anywhere; }
  .cLayer { display: grid; grid-template-columns: 96px 1fr 44px; align-items: center; gap: 10px; padding: 7px 0; }
  .cLayer button { background: transparent; border: 0; color: var(--bone); font: 400 14px var(--font); text-align: left; padding: 0; cursor: pointer; }
  .cLayer button:hover { color: var(--coral); }
  .cLayer .track { height: 2px; background: var(--line); position: relative; }
  .cLayer .track i { position: absolute; left: 0; top: 0; bottom: 0; background: var(--bone); transition: width .4s; }
  .cLayer.hot .track i { background: var(--coral); }
  .cLayer small { color: var(--iron); font-size: 12px; text-align: right; font-variant-numeric: tabular-nums; }
  .cMuted { color: var(--iron); }
  .cState { font-size: 28px; line-height: 1.05; letter-spacing: -.035em; color: var(--ink); margin: 6px 0 2px; }

  /* --- ответ Chloe: крупный заголовок, как в студийной вёрстке --- */
  #reply { position: absolute; left: 40px; bottom: 120px; z-index: 4; max-width: min(760px, calc(100% - 520px)); min-height: 0;
    font-size: 45px; line-height: .98; letter-spacing: -.045em; font-weight: 400; color: var(--ink); text-align: left;
    transition: opacity .6s; pointer-events: none; text-shadow: 0 0 24px var(--bg);
    max-height: calc(100% - 64px - 150px); overflow-y: auto; scrollbar-width: thin; scrollbar-color: var(--line) transparent; }
  #reply.scroll { pointer-events: auto; }   /* длинный ответ не уходит под шапку — его можно прокрутить */
  #reply.heard { color: var(--iron); font-style: normal; }
  #reply.heard::before { content: "Вы: "; color: var(--coral); }

  /* --- ЭЭГ и машина времени: правый низ --- */
  #eeg { position: absolute; right: 40px; bottom: 132px; width: 400px; z-index: 4; display: flex; flex-direction: column; gap: 6px;
    padding-top: 12px; border-top: 1px solid var(--line); }
  #eegCanvas { width: 100%; height: 40px; display: block; }
  #eegInfo { display: flex; justify-content: space-between; gap: 8px; font-size: 11px; letter-spacing: .04em; color: var(--iron); }
  #eegInfo b { color: var(--bone); font-weight: 400; }

  #timeRow { position: absolute; right: 40px; bottom: 84px; width: 400px; z-index: 4; display: flex; align-items: center; gap: 14px;
    font-size: 12px; color: var(--iron); }
  #timeRow input[type=range] { flex: 1; accent-color: var(--bone); padding: 0; border: none; background: none; height: 20px; }
  #timePlay { background: transparent; border: 0; border-bottom: 1px solid var(--line); color: var(--bone); padding: 4px 0;
    font-size: 13px; cursor: pointer; white-space: nowrap; }
  #timePlay:hover { color: var(--coral); border-color: var(--coral); }
  #timeLabel { min-width: 74px; text-align: right; color: var(--bone); font-variant-numeric: tabular-nums; }

  /* --- низ: команда слева, разделы справа --- */
  #cmd { position: absolute; left: 40px; bottom: 32px; z-index: 4; width: min(560px, calc(100% - 560px)); box-sizing: border-box; }
  #bottom { position: absolute; right: 40px; bottom: 28px; z-index: 4; display: flex; align-items: center; gap: 28px; }
  #legend { display: flex; gap: 16px; font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: var(--iron); }
  #legend i { display: inline-block; width: 7px; height: 7px; border-radius: 50%; margin-right: 6px; vertical-align: 0; }
  #toggles { display: flex; gap: 4px 20px; flex-wrap: wrap; justify-content: flex-end; }
  #toggles button { background: transparent; border: 0; border-bottom: 1px solid transparent; color: var(--iron); padding: 8px 0;
    font-size: 14px; letter-spacing: -.01em; cursor: pointer; transition: color .15s, border-color .15s; }
  #toggles button:hover { color: var(--ink); }
  #toggles button.on { color: var(--ink); border-bottom-color: var(--coral); }

  input { background: transparent; border: 0; border-bottom: 1px solid var(--line); border-radius: 0; padding: 12px 0;
    font: 400 16px var(--font); letter-spacing: -.01em; color: var(--ink); outline: none; transition: border-color .15s; }
  input::placeholder { color: var(--iron); }
  input:focus { border-bottom-color: var(--coral); }

  /* --- панели: выезжают справа на всю высоту --- */
  .panel { position: absolute; top: 64px; right: 0; bottom: 0; width: 440px; max-width: 100%; z-index: 6; display: none;
    background: var(--bg); border-left: 1px solid var(--line); padding: 32px 40px 40px; font-size: 14px; line-height: 1.55;
    color: var(--bone); overflow-y: auto; box-sizing: border-box; cursor: default; }
  .panel b { color: var(--ink); font-weight: 400; font-size: 28px; line-height: 1; letter-spacing: -.035em; display: inline-block; margin-bottom: 6px; }
  .panel h4 { margin: 24px 0 8px; padding-top: 14px; border-top: 1px solid var(--line); font-size: 11px; font-weight: 500;
    letter-spacing: .14em; text-transform: uppercase; color: var(--iron); }
  .panel .close { float: right; cursor: pointer; color: var(--iron); font-size: 22px; line-height: 1; padding: 4px 0 4px 12px; }
  .panel .close:hover { color: var(--coral); }
  .bar { display: inline-block; width: 90px; height: 2px; background: var(--line); vertical-align: middle; margin-left: 8px; }
  .bar i { display: block; height: 100%; background: var(--bone); }
  .row { display: flex; justify-content: space-between; align-items: center; gap: 8px; padding: 6px 0; border-bottom: 1px solid #161616; }
  .row span:first-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .panel button.small { background: transparent; border: 0; border-bottom: 1px solid var(--bone); color: var(--bone); border-radius: 0;
    padding: 6px 0; font-size: 14px; cursor: pointer; margin: 8px 22px 4px 0; letter-spacing: -.01em; }
  .panel button.small::after { content: " →"; }
  .panel button.small:hover { color: var(--ink); border-color: var(--ink); }
  .panel button.small.on { color: var(--coral); border-color: var(--coral); }
  .panel button.danger { color: var(--coral); border-color: var(--coral); }
  .panel button.danger::after { content: " ×"; }
  .panel input { font-size: 14px; padding: 8px 0; }

  /* журнал */
  .jTop { display: flex; gap: 16px; align-items: center; margin: 10px 0 14px; }
  .jTop input { flex: 1; min-width: 0; }
  .jItem { display: flex; gap: 12px; align-items: baseline; padding: 7px 0; border-bottom: 1px solid #161616; cursor: pointer; }
  .jItem:hover .x { color: var(--coral); }
  .jItem .t { color: var(--iron); font-size: 12px; flex: none; font-variant-numeric: tabular-nums; }
  .jItem .k { flex: none; width: 14px; text-align: center; }
  .jItem .x { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; transition: color .15s; }
  .jItem.heard { margin-top: 14px; }
  .jItem.heard .x { color: var(--ink); }
  .jItem.said .x { color: var(--bone); }
  .jItem.step { padding-left: 26px; }
  .jItem.fail .x, .jItem.fail .k { color: var(--err); }
  .jItem .shot { flex: none; font-size: 11px; color: var(--iron); }
  .jDetail pre { white-space: pre-wrap; word-break: break-word; background: transparent; border: 1px solid var(--line); padding: 10px 12px;
    margin: 8px 0; font-size: 12px; max-height: 240px; overflow-y: auto; color: var(--bone); }
  .jDetail img { width: 100%; border: 1px solid var(--bone); margin: 8px 0; }
  /* память и файлы */
  .mItem { padding: 10px 0; border-bottom: 1px solid #161616; cursor: pointer; }
  .mItem:hover .x { color: var(--coral); }
  .mItem .x { color: var(--ink); font-size: 16px; letter-spacing: -.015em; transition: color .15s; }
  .mItem .t { color: var(--iron); font-size: 12px; }
  .mEdit textarea { width: 100%; box-sizing: border-box; min-height: 72px; background: transparent; border: 1px solid var(--line);
    color: var(--ink); padding: 10px 12px; font: 400 15px var(--font); resize: vertical; outline: none; }
  .mEdit textarea:focus { border-color: var(--coral); }
  .fItem { padding: 10px 0; border-bottom: 1px solid #161616; }
  .fItem .x { color: var(--ink); word-break: break-word; }
  .fItem.undone .x { color: var(--iron); text-decoration: line-through; }
  .fItem .t { color: var(--iron); font-size: 12px; }

  /* живые обои: только мозг */
  body.wall header, body.wall #stats, body.wall #filters, body.wall #reply,
  body.wall #timeRow, body.wall #eeg, body.wall #bottom, body.wall #cmd, body.wall #zoom, body.wall #search { display: none; }
  body.wall #core { cursor: default; }
  /* в программе микрофон и голос ведёт Python */
  body.app #micBtn, body.app #soundBtn { display: none; }
  #phoneBtn { display: none; } body.app #phoneBtn { display: inline-block; } html.phone #phoneBtn { display: none !important; }
  #phonePanel .qr { background: #fff; padding: 10px; width: 220px; height: 220px; margin: 12px 0; }
  #phonePanel .qr svg { width: 100%; height: 100%; display: block; }
  #phonePanel ol { margin: 8px 0; padding-left: 18px; }
  #phonePanel code { color: var(--ink); word-break: break-all; font-size: 12px; }

  /* чистый вид: только мозг, имя и ответ; всё остальное — по кнопке «Все функции» */
  body.clean #stats, body.clean #filters, body.clean #search, body.clean #zoom,
  body.clean #eeg, body.clean #timeRow, body.clean #bottom, body.clean #cmd,
  body.clean .zone { display: none !important; }
  body.clean .region { opacity: .7; }
  body.clean #core { cursor: default; }
  body.clean #reply { bottom: 56px; max-width: min(900px, calc(100% - 80px)); font-size: 56px; }

  /* ===== мобильная версия: телефон-пульт и узкое окно =====
     Снизу вверх: панель ввода → разделы → активность → ответ Chloe. Мозг — за всем этим, на весь экран. */
  @media (max-width: 900px) {
    :root { --sa: env(safe-area-inset-bottom, 0px); }
    header { height: calc(56px + env(safe-area-inset-top, 0px)); padding: env(safe-area-inset-top, 0px) 20px 0; box-sizing: border-box; }
    header b { font-size: 18px; }
    header > span { gap: 8px; font-size: 13px; }
    #moreBtn { margin-left: 14px; font-size: 13px; min-height: 44px; }
    #seeBtn { margin-left: 12px; padding-left: 12px; max-width: 34vw; font-size: 13px; min-height: 44px; }
    #statusTxt { display: none; }

    #stats { left: 20px; top: calc(72px + env(safe-area-inset-top, 0px)); font-size: 10px; letter-spacing: .12em; }
    #stats span { font-size: 12px; }
    #filters { left: 0; right: 0; top: calc(94px + env(safe-area-inset-top, 0px)); padding: 0 20px; flex-wrap: nowrap;
      overflow-x: auto; scrollbar-width: none; gap: 0 20px; }
    #filters::-webkit-scrollbar { display: none; }
    .chip { min-height: 40px; }
    #search { left: 20px; right: 20px; top: calc(140px + env(safe-area-inset-top, 0px)); }
    #search input { flex: 1; width: auto; }
    #zoom, #legend, #timeRow { display: none; }        /* на телефоне масштаб — двумя пальцами */

    /* панель ввода: на телефоне — #phoneBar из remote.js, в узком окне — #cmd */
    #cmd { left: 20px; right: 20px; width: auto; bottom: calc(var(--sa) + 16px); }
    #bottom { left: 0; right: 0; bottom: calc(var(--sa) + 80px); padding: 0 20px; }
    #toggles { flex-wrap: nowrap; overflow-x: auto; scrollbar-width: none; justify-content: flex-start; gap: 0 20px; width: 100%; }
    #toggles::-webkit-scrollbar { display: none; }
    #toggles button { flex: none; min-height: 44px; font-size: 15px; }
    #eeg { left: 20px; right: 20px; width: auto; bottom: calc(var(--sa) + 132px); gap: 4px; padding-top: 8px; }
    #eegCanvas { height: 28px; }
    #eegInfo { font-size: 10px; }
    #reply, body.clean #reply { left: 20px; right: 20px; max-width: none; bottom: calc(var(--sa) + 200px); font-size: 30px; line-height: 1.02; }
    body.clean #reply { bottom: calc(var(--sa) + 104px); font-size: 34px; }

    /* разделы открываются на весь экран */
    .panel { top: calc(56px + env(safe-area-inset-top, 0px)); width: 100%; border-left: 0; z-index: 7;
      padding: 24px 20px calc(40px + var(--sa)); font-size: 15px; -webkit-overflow-scrolling: touch; }
    .panel b { font-size: 26px; }
    .panel .close { font-size: 26px; padding: 6px 0 10px 16px; }
    .panel button.small { min-height: 44px; font-size: 15px; }
    .jItem, .mItem, .fItem { padding: 12px 0; }
    .jItem .x { white-space: normal; }
    .label { font-size: 11px; }
  }
  @media (max-width: 900px) and (orientation: landscape) and (max-height: 500px) {
    #eeg, #stats, #search { display: none; }
    #reply, body.clean #reply { bottom: calc(var(--sa) + 132px); font-size: 24px; }
  }
</style>
</head>
<body>
<div id="app">
  <header><b>Chloe</b><span><i id="dot"></i><span id="statusTxt">онлайн</span><button id="spendBtn" title="Сколько стоили запросы к моделям сегодня (оценка по прайсу). Нажмите — подробнее в ядре." hidden></button><button id="seeBtn" title="Постоянное зрение: Chloe видит экран. Нажмите, чтобы выключить или включить." hidden><i id="seeEye"></i><span id="seeTxt">Вижу экран</span></button><button id="moreBtn">Все функции</button></span></header>
  <div id="stats">нейронов <span id="sN">0</span> · связей <span id="sL">0</span> · зон <span id="sZ">0</span> · сигналов <span id="sS">0</span></div>
  <div id="filters"></div>
  <div id="core">
    <div id="search"><input id="searchInput" placeholder="Поиск в мозге" autocomplete="off"><span id="searchCount"></span></div>
    <div id="zoom">
      <button id="zIn" title="Приблизить (+)">+</button>
      <button id="zOut" title="Отдалить (−)">−</button>
      <button id="zReset" title="Сбросить вид (0)">⟲</button>
      <div id="zoomLvl">100%</div>
    </div>
    <div id="info" class="panel"></div>
    <div id="statsPanel" class="panel"></div>
    <div id="corePanel" class="panel"></div>
    <div id="journalPanel" class="panel"></div>

<script>
(function () {

      a = (a + 0x6D2B79F5) >>> 0;

  }
  function escapeHtml(s) {

  var COLOR_SKILL = new THREE.Color(0xd6d6d6);   // стиль Channel Studio: монохром + коралл
  var COLOR_MEM = new THREE.Color(0x8f8f8f);
  var COLOR_HOT = new THREE.Color(0xffffff);

  var COLOR_GOLD = new THREE.Color(0xff7777);   // ход мысли — единственный цвет
  var COLOR_DREAM = new THREE.Color(0x9a9a9a);
  var COLOR_INH = new THREE.Color(0x5e5e5e);
  var SIG_SKILL = new THREE.Color(0xd6d6d6).lerp(new THREE.Color(0xffffff), 0.4);

  var SHELL_BASE = new THREE.Color(0xb4b4b4);
  var SHELL_WARM = new THREE.Color(0xff7777);
  var SHELL_COLD = new THREE.Color(0xe05555);
  var SHELL_SLEEP = new THREE.Color(0x3a3a3a);

  var MAX_N = 16384, MAX_L = 49152, AX = 12, DEND_MAX = 64, GROW = 2.6;   // максимум мозга

  function hash(x) { var s = Math.sin(x) * 43758.5453; return (s - Math.floor(s)) * 6.2831853; }
  function phases(id) { return [hash(id * 12.9898 + 1.0), hash(id * 78.233 + 2.0), hash(id * 39.425 + 3.0)]; }
  var GLSL_COMMON = [
    "float hsh(float x){ return fract(sin(x) * 43758.5453) * 6.2831853; }",
    "vec3 driftOf(float id, float t, float amp){",
    "  vec3 ph = vec3(hsh(id*12.9898+1.0), hsh(id*78.233+2.0), hsh(id*39.425+3.0));",
    "  return amp * vec3(sin(t*0.31+ph.x), sin(t*0.27+ph.y), sin(t*0.35+ph.z));",
    "}",
    "vec4 texAt(sampler2D tex, float id, float size){",
    "  vec2 uv = vec2(mod(id, size) + 0.5, floor(id / size) + 0.5) / size;",
    "  return texture2D(tex, uv);",
    "}",
    "float easeOut(float x){ x = clamp(x, 0.0, 1.0); return 1.0 - pow(1.0 - x, 3.0); }",
    // приглушение в толпе, которое исчезает при приближении
    "uniform float uCrowdK;",
    // при приближении на экран попадает меньше клеток — их можно делать ярче (пропорционально площади)
    "float crowdF(float lo, float dens, float zoom){ return min(1.0, mix(lo * uCrowdK, 1.0, smoothstep(0.3, 0.8, dens)) * (1.0 + (max(zoom, 1.0) - 1.0) * 0.6 * uCrowdK)); }",
    // поиск: найденные ярче, остальные гаснут

  ].join("\n");

  function driftOf(id, t, out) {

  }

  // Состояние нейронов и связей хранится в текстурах, их читает видеокарта
  var NT = 128, LT = 256;   // 128×128 = 16384 нейрона, 256×256 = 65536 связей
  var neurData = new Float32Array(NT * NT * 4);   // сила, жар, рождение, тип
  var neur2Data = new Float32Array(NT * NT * 4);  // ошибка, найден, видимость, —
  var linkData = new Float32Array(LT * LT * 4);   // вес, свечение, рождение, мысль
  var link2Data = new Float32Array(LT * LT * 4);  // миелин, тормозящая, след активности, награда (дофамин)
  function dataTex(arr, size) {
    var t = new THREE.DataTexture(arr, size, size, THREE.RGBAFormat, THREE.FloatType);
    t.minFilter = t.magFilter = THREE.NearestFilter;
    t.needsUpdate = true;

  }
  var neurTex = dataTex(neurData, NT), neur2Tex = dataTex(neur2Data, NT), linkTex = dataTex(linkData, LT), link2Tex = dataTex(link2Data, LT);
  // мембранный потенциал: покой 0, порог 1, после импульса — ниже покоя
  var vPot = new Float32Array(MAX_N), refUntil = new Float32Array(MAX_N);
  var NEURO = {
    threshold: 1.0,     // порог импульса
    reset: -0.35,       // гиперполяризация после импульса
    refractory: 0.5,    // секунд «отдыха» после импульса
    leak: 2.5,          // как быстро заряд стекает к покою
    synapse: 0.75,      // сколько заряда передаёт связь весом 1
    maxDepth: 3,        // как далеко расходится цепная реакция
    traceTau: 8         // сколько секунд связь «помнит», что работала (для дофамина)
  };

  var common = {
    uTime: { value: 0 }, uPixel: { value: DPR }, uProj: { value: 500 }, uScaleW: { value: 1 },
    uDens: { value: 1 }, uZoom: { value: 1 }, uDrift: { value: 0.035 },
    uSpeak: { value: 0 }, uChloe: { value: 0 }, uThink: { value: 0 }, uSleep: { value: 0 },
    uSearchOn: { value: 0 }, uBright: { value: 1 }, uCrowdK: { value: 1 }, uDeep: { value: 0 },
    uNeur: { value: neurTex }, uNeur2: { value: neur2Tex }, uLink: { value: linkTex }, uLink2: { value: link2Tex },
    uInh: { value: new THREE.Color(0x5e5e5e) }, uWarm: { value: new THREE.Color(0xff9a9a) },
    uSkill: { value: COLOR_SKILL }, uMem: { value: COLOR_MEM }, uHotC: { value: COLOR_HOT },
    uErrC: { value: COLOR_ERR }, uGold: { value: COLOR_GOLD }
  };

  // =======================================================
  // 1. СОСТОЯНИЯ И НАСТРОЕНИЕ
  // =======================================================
  var STATE = { name: "idle", since: 0 };
  var mood = { think: 0, speak: 0, listen: 0, sleep: 0 };
  var feel = { valence: 0, fatigue: 0 };   // + тепло (успех), − холод (ошибка); усталость 0..1
  var voice = { user: 0, chloe: 0 };
  var lastActivity = 0;
  var dot = document.getElementById("dot"), statusTxt = document.getElementById("statusTxt");
  function setState(name) {
    if (STATE.name === name) return;
    STATE.name = name;
    STATE.since = now();
    sound.state(name);
    statusTxt.textContent = name === "sleeping" ? "спит" : "онлайн";
    dot.style.background = name === "sleeping" ? "#3a3a3a" : "#FF7777";
  }
  function touch() {
    lastActivity = now();
    sensory = Math.min(1, sensory + 0.6);
    if (STATE.name === "sleeping") setState("idle");
  }

  // =======================================================
  // 2. ОБОЛОЧКА, ДЫМКА, ПЫЛИНКИ
  // =======================================================
  var SPH = 1.25, SN = 16000;
  var shellPos = new Float32Array(SN * 3), shellBr = new Float32Array(SN), shellSeed = new Float32Array(SN);
  var golden = Math.PI * (3 - Math.sqrt(5));
  (function () {
    // перемешанный порядок, чтобы при снижении качества точки редели равномерно
    var order = []; for (var i = 0; i < SN; i++) order.push(i);
    for (var k = SN - 1; k > 0; k--) { var j = Math.floor(Math.random() * (k + 1)); var tmp = order[k]; order[k] = order[j]; order[j] = tmp; }
    for (var m = 0; m < SN; m++) {
      var i2 = order[m];
      var y = 1 - (i2 / (SN - 1)) * 2, r = Math.sqrt(1 - y * y), th = golden * i2, R = SPH + rnd(-0.015, 0.015);
      shellPos[m * 3] = Math.cos(th) * r * R; shellPos[m * 3 + 1] = y * R; shellPos[m * 3 + 2] = Math.sin(th) * r * R;
      shellBr[m] = 0.4 + 0.35 * Math.abs(Math.sin(y * 9));
      shellSeed[m] = Math.random();
    }
  })();
  // точка на поверхности сферы в направлении dir — для вспышек и импульсов от ядра
  function surfaceToward(dir, out) {
    return (out || new THREE.Vector3()).copy(dir).normalize().multiplyScalar(SPH);
  }
  var shellGeo = new THREE.BufferGeometry();
  shellGeo.setAttribute("position", new THREE.BufferAttribute(shellPos, 3));
  shellGeo.setAttribute("aBright", new THREE.BufferAttribute(shellBr, 1));
  shellGeo.setAttribute("aSeed", new THREE.BufferAttribute(shellSeed, 1));

  var FLASHES = 6, flashData = [], flashIndex = 0;
  for (var f = 0; f < FLASHES; f++) flashData.push(new THREE.Vector4(0, 0, 0, -100));
  function shellFlash(p) {
    var d = p.clone().normalize().multiplyScalar(SPH);
    flashData[flashIndex].set(d.x, d.y, d.z, now());
    flashIndex = (flashIndex + 1) % FLASHES;
  }
  var WAVES = 4, waveData = [], waveIndex = 0, nextWave = 0, WAVE_SPEED = "1.10";
  for (var wv = 0; wv < WAVES; wv++) waveData.push(-100);
  function emitWave(t) { waveData[waveIndex] = t; waveIndex = (waveIndex + 1) % WAVES; }

  var shellUniforms = {
    uTime: common.uTime, uPixel: common.uPixel, uBright: common.uBright,
    uTw: { value: 0 }, uEnergy: { value: 0.3 }, uListen: { value: 0 }, uVoice: { value: 0 },
    uFlash: { value: flashData }, uWave: { value: waveData },
    uBase: { value: SHELL_BASE.clone() }, uHot: { value: new THREE.Color(0xe6e6e6) }
  };
  var shell = new THREE.Points(shellGeo, new THREE.ShaderMaterial({
    uniforms: shellUniforms, transparent: true, depthWrite: false, blending: THREE.AdditiveBlending,
    vertexShader: [
      "uniform float uTime; uniform float uTw; uniform float uEnergy; uniform float uListen; uniform float uPixel; uniform float uVoice;",
      "uniform vec4 uFlash[" + FLASHES + "];",
      "uniform float uWave[" + WAVES + "];",
      "attribute float aBright; attribute float aSeed;",
      "varying float vBright; varying float vHot;",
      "void main() {",
      "  vec3 n = normalize(position);",
      "  float w = sin(n.x*3.1+uTime*0.9)+sin(n.y*4.3-uTime*0.7)+sin(n.z*3.7+uTime*1.1)+0.5*sin((n.x+n.y)*6.0-uTime*1.6);",
      "  float ripple = sin(n.x*11.0+uTime*9.0)*sin(n.y*9.0-uTime*7.0)*sin(n.z*10.0+uTime*8.0);",
      "  vec3 p = position + n * (w * 0.09 * uEnergy + ripple * 0.11 * uListen);",
      "  float hot = 0.0;",
      "  for (int i = 0; i < " + FLASHES + "; i++) {",
      "    float age = uTime - uFlash[i].w;",
      "    if (age > 0.0 && age < 2.4) {",
      "      float d = distance(position, uFlash[i].xyz);",
      "      float front = age * 0.7;",
      "      float fade = pow(1.0 - age / 2.4, 2.0);",
      "      float ring = exp(-pow((d - front) / 0.16, 2.0));",
      "      float tail = d < front ? 0.35 * exp(-(front - d) / 0.25) : 0.0;",   // мягкий след позади фронта
      "      hot += (ring + tail) * fade * 0.6;",
      "    }",
      "  }",
      "  for (int i = 0; i < " + WAVES + "; i++) {",
      "    float age = uTime - uWave[i];",
      "    float front = age * " + WAVE_SPEED + ";",
      "    if (age > 0.0 && front < 1.9) {",
      "      float k = exp(-pow((front - 1.25) / 0.22, 2.0)) * (1.0 - front / 1.9);",
      "      p += n * k * (0.05 + 0.07 * uVoice);",   // волна голоса: чем громче речь, тем выше и ярче
      "      hot += k * (0.25 + 0.4 * uVoice);",
      "    }",
      "  }",
      "  vBright = aBright * (0.94 + 0.06 * sin(uTw*(1.0+aSeed*2.0)+aSeed*40.0)) * (1.0 + uListen * 0.6);",
      "  vHot = clamp(hot, 0.0, 0.8);",
      "  vec4 mv = modelViewMatrix * vec4(p, 1.0);",
      "  gl_PointSize = min((2.0 + 1.2 * vHot) * uPixel * (4.5 / -mv.z), 12.0 * uPixel);",
      "  gl_Position = projectionMatrix * mv;",
      "}"
    ].join("\n"),

      "uniform vec3 uBase; uniform vec3 uHot; uniform float uBright;",
      "varying float vBright; varying float vHot;",
      "void main() {",
      "  float r = length(gl_PointCoord - 0.5);",
      "  if (r > 0.5) discard;",

  var cortexUniforms = { uBreath: { value: 0 } };   // сетки мозга нет — сфера дышит через shell.scale

  // =======================================================
  // 2б. ЯДРО CHLOE И ВНУТРЕННИЕ СЛОИ
  // Между полушариями — живое ядро: источник активности. Вокруг — четыре слоя-орбиты:
  // Мышление, Память, Процессы, Данные. Каждый крутится и светится тем сильнее, чем больше сейчас работает.
  // От ядра к коре летят импульсы; на коре они расходятся кольцом.
  // =======================================================
  var CORE_POS = new THREE.Vector3(0, -0.04, 0);
  var coreGroup = new THREE.Group();
  coreGroup.position.copy(CORE_POS);
  group.add(coreGroup);
  var coreGlow = new THREE.Sprite(new THREE.SpriteMaterial({ map: glowTex, color: new THREE.Color(0xff9a9a), transparent: true,
    opacity: 0.5, blending: THREE.AdditiveBlending, depthWrite: false }));
  var coreHeart = new THREE.Sprite(new THREE.SpriteMaterial({ map: glowTex, color: new THREE.Color(0xffffff), transparent: true,
    opacity: 0.9, blending: THREE.AdditiveBlending, depthWrite: false }));
  coreGlow.scale.setScalar(0.6); coreHeart.scale.setScalar(0.14);
  coreGroup.add(coreGlow); coreGroup.add(coreHeart);

  var LAYERS = [
    { key: "think", name: "Мышление", r: 0.25, tilt: [0.35, 0, 0.1],  color: 0xff7777, n: 120, act: 0, phase: 0, opens: "core" },
    { key: "mem",   name: "Память",   r: 0.34, tilt: [1.2, 0.4, 0],  color: 0xe6e6e6, n: 150, act: 0, phase: 1, opens: "memory" },
    { key: "proc",  name: "Процессы", r: 0.43, tilt: [-0.5, 0.9, 0.3], color: 0xcacaca, n: 180, act: 0, phase: 2, opens: "journal" },
    { key: "data",  name: "Данные",   r: 0.52, tilt: [0.9, -0.7, 0.5], color: 0x9a9a9a, n: 210, act: 0, phase: 3, opens: "files" }
  ];
  LAYERS.forEach(function (L) {

      color: L.color, transparent: true, opacity: 0.08, blending: THREE.AdditiveBlending, depthWrite: false }));
    holder.add(line);
    // частицы, бегущие по орбите
    var ang = new Float32Array(L.n), off = new Float32Array(L.n), pos = new Float32Array(L.n * 3);
    for (var j = 0; j < L.n; j++) { ang[j] = Math.random() * Math.PI * 2; off[j] = Math.random(); }
    var g = new THREE.BufferGeometry();
    g.setAttribute("position", new THREE.BufferAttribute(pos, 3));

    }
    var v0 = id * AX * 2, cnt = AX * 2;
    ["aT", "aSide", "aLink", "aA", "aB", "aType"].forEach(function (nm) { markRange(axGeo, nm, v0, cnt); });
    markRange(axGeo, "position", v0 * 3, cnt * 3);
    markRange(axGeo, "aTan", v0 * 3, cnt * 3);
    axGeo.setDrawRange(0, lCount * axSegs * 6);

    linkData[id * 4] = opt.weight !== undefined ? opt.weight : HEBB.linkStart;
    linkData[id * 4 + 1] = 0;
    linkData[id * 4 + 2] = opt.born !== undefined ? opt.born : now();
    linkData[id * 4 + 3] = 0;
    link2Data[id * 4] = opt.myelin || 0;
    link2Data[id * 4 + 1] = opt.inhib ? 1 : 0;
    link2Data[id * 4 + 2] = 0;
    link2Data[id * 4 + 3] = 0;
    dirty = true;
    return link;
  }
  function linkBetween(a, b) {
    for (var i = 0; i < a.links.length; i++) { var l = a.links[i]; if (l.a === b || l.b === b) return l; }
    return null;
  }

  // создать нейрон (без связей); opt: base, bornMs, uses, strength, grown
  function createNeuron(name, type, desc, zoneName, opt) {
    if (nCount >= MAX_N) return null;
    opt = opt || {};
    type = type === "memory" ? "memory" : "skill";
    var zone = getZone(zoneName || (type === "memory" ? "Память" : "Навыки"));
    var base = opt.base || (zone.topic ? pickTopic(zone) : pickAnatomical(name, type, zone));
    var id = nCount++;
    zone.count++;
    var n = {
      id: id, name: name, type: type, desc: desc || "", zone: zone.name,
      base: base, bornMs: opt.bornMs || Date.now(), uses: opt.uses || 0, errors: opt.errors || 0,
      links: [], labelUntil: opt.grown ? 0 : now() + 4.5, labelKind: "",
      scar: opt.scar || 0,       // след частых ошибок: тусклый красный, сходит после успешной работы
      world: opt.world || "",    // предмет из мира пользователя: «Программа», «Сайт», «Папка», «Файл», «Место», «Человек»
      q: opt.q || "",            // что искать в журнале для истории этого предмета
      lastMs: opt.lastMs || 0, working: 0
    };
    neurons.push(n);
    gridAdd(n);
    somaPos[id * 3] = base.x; somaPos[id * 3 + 1] = base.y; somaPos[id * 3 + 2] = base.z;
    somaId[id] = id;
    markRange(somaGeo, "position", id * 3, 3);
    markRange(somaGeo, "aId", id, 1);
    somaGeo.setDrawRange(0, nCount);
    neurData[id * 4] = opt.strength !== undefined ? opt.strength : HEBB.start;
    neurData[id * 4 + 1] = 0;
    neurData[id * 4 + 2] = opt.grown ? -100 : now();
    neurData[id * 4 + 3] = type === "memory" ? 1 : 0;
    neur2Data[id * 4] = 0;
    neur2Data[id * 4 + 1] = 0;
    neur2Data[id * 4 + 2] = 0;    // проявится плавно
    n.dendScale = opt.dendScale || density();
    growDendrites(id, base, (type === "memory" ? 0.75 : 1) * n.dendScale);
    dirty = true;
    return n;
  }

  // новый нейрон: прорастает к ближайшим
  function addNeuron(name, type, desc, zoneName) {
    var n = createNeuron(name, type, desc, zoneName);
    if (!n) return null;
    var want = n.type === "memory" ? 2 : 3;
    nearest(n.base, want, n).forEach(function (m) { connect(m, n); });
    // редкая дальняя связь между зонами, как в настоящем мозге
    if (nCount > 13 && Math.random() < 0.25) {
      var far = neurons[Math.floor(Math.random() * (nCount - 1))];
      if (far !== n && !linkBetween(far, n)) connect(far, n);
    }
    shellFlash(n.base);
    sound.click(n.type === "memory" ? 1040 : 880);
    if (searchQuery) applySearch(searchQuery, false);
    return n;
  }

  function sendSignal(link, dir, depth, opt) {
    if (signals.length >= MAX_S) return null;
    opt = opt || {};
    var my = link2Data[link.id * 4], inh = link2Data[link.id * 4 + 1] > 0.5, w = linkData[link.id * 4];
    var s = {
      link: link, dir: dir, t: dir > 0 ? 0 : 1, depth: depth,
      // миелин ускоряет проведение в несколько раз
      speed: (opt.speed || 0.55) * (1 + 3 * my),
      color: opt.color || (inh ? COLOR_INH : (link.b.type === "memory" ? SIG_MEM : SIG_SKILL)),
      alpha: opt.alpha || clamp(0.2 + 0.55 * w, 0.2, 1),   // слабая связь — слабый, едва видный сигнал
      onArrive: opt.onArrive || null, gain: opt.gain === undefined ? 1 : opt.gain,
      kind: opt.kind || "spike"
    };
    signals.push(s);
    return s;
  }

  // Импульс (потенциал действия): всё или ничего. Идёт по всем отросткам клетки,
  // но соседи вспыхнут, только если связь сильная и их заряд дойдёт до порога.
  function spike(n, fromLink, depth) {
    var t = now(), id = n.id;
    if (t < refUntil[id]) return false;               // клетка отдыхает после прошлого импульса
    neurData[id * 4 + 1] = 1;
    vPot[id] = NEURO.reset;
    refUntil[id] = t + NEURO.refractory;
    eeg.kick += 0.18; eeg.spikes++;
    if (depth >= NEURO.maxDepth) return true;
    n.links.forEach(function (l) {
      if (l === fromLink || t - linkData[l.id * 4 + 2] < GROW) return;
      sendSignal(l, l.a === n ? 1 : -1, depth + 1);
    });
    return true;
  }

  // Синаптическая передача: сигнал дошёл до клетки
  function deliver(sg) {
    var l = sg.link, li = l.id * 4;
    var target = sg.dir > 0 ? l.b : l.a, ti = target.id;
    synFlash(l, sg.dir > 0 ? 1 : 0, sg);
    if (sg.kind !== "spike") return;
    var inh = link2Data[li + 1] > 0.5;
    if (now() < refUntil[ti]) return;                 // в рефрактерности клетка не отвечает
    vPot[ti] += (inh ? -1 : 1) * linkData[li] * NEURO.synapse;
    if (!inh && vPot[ti] >= NEURO.threshold) {
      // сигнал вызвал импульс — связь крепнет (правило Хебба), растёт миелин, остаётся след для дофамина
      linkData[li] = Math.min(HEBB.linkMax, linkData[li] + HEBB.linkGain);
      link2Data[li] = Math.min(1, link2Data[li] + 0.03);
      link2Data[li + 2] = 1;
      neurData[ti * 4] = Math.min(HEBB.max, neurData[ti * 4] + HEBB.gain * 0.25);
      spike(target, l, sg.depth);
    } else if (!inh) {
      linkData[li] = Math.max(HEBB.linkMin, linkData[li] - 0.005);   // не вызвал — чуть слабеет
    }
    dirty = true;
  }

  // Навык реально используется: клетка даёт импульс
  function fire(n, depth, quiet) {
    if (!n) return;
    var i = n.id * 4;
    n.uses++;
    neurData[i] = Math.min(HEBB.max, neurData[i] + HEBB.gain);
    n.labelUntil = Math.max(n.labelUntil, now() + 3);
    refUntil[n.id] = 0;
    spike(n, null, 1);
    if (!quiet) shellFlash(n.base);
    dirty = true;
    if (selected === n) showInfo(n);
  }

  // вспышка синапса на конце аксона
  var synFlashes = [];
  function synFlash(link, end, sg) {
    if (synFlashes.length > 300) synFlashes.shift();
    synFlashes.push({ link: link, end: end, born: now(), color: sg.color, alpha: sg.alpha });
  }

  // =======================================================
  // 6. ХОД МЫСЛЕЙ: цепочка шагов загорается золотом по очереди
  // =======================================================
  function findPath(from, to) {
    if (from === to) return [];
    var prev = {}; prev[from.id] = null;
    var queue = [from], t = now();
    while (queue.length) {
      var cur = queue.shift();
      for (var i = 0; i < cur.links.length; i++) {
        var l = cur.links[i];
        if (t - linkData[l.id * 4 + 2] < GROW) continue;
        var nx = l.a === cur ? l.b : l.a;
        if (prev[nx.id] !== undefined) continue;
        prev[nx.id] = { n: cur, l: l };
        if (nx === to) {
          var path = [], c = to;
          while (prev[c.id]) { path.unshift({ link: prev[c.id].l, dir: prev[c.id].l.a === prev[c.id].n ? 1 : -1, to: c }); c = prev[c.id].n; }
          return path;
        }
        queue.push(nx);
      }
    }
    return null;
  }

  var episodes = [];      // реальные цепочки мыслей за день — их мозг переигрывает во сне
  function think(steps, onDone) {
    var list = steps.map(function (s) { return typeof s === "string" ? findSkill(s) : s; }).filter(Boolean);
    if (!list.length) { if (onDone) onDone(); return; }
    if (list.length > 1) { episodes.push(list.slice()); if (episodes.length > 40) episodes.shift(); }
    var hops = [];
    for (var i = 0; i < list.length - 1; i++) {
      var path = findPath(list[i], list[i + 1]);
      if (path === null) {
        // пути нет — Chloe прокладывает новую связь
        var l = connect(list[i], list[i + 1], { born: now() - GROW });
        path = l ? [{ link: l, dir: l.a === list[i] ? 1 : -1, to: list[i + 1] }] : [];
      }
      hops = hops.concat(path);
    }
    function mark(n) {
      neurData[n.id * 4 + 1] = 1;
      neurData[n.id * 4] = Math.min(HEBB.max, neurData[n.id * 4] + HEBB.gain * 0.5);
      vPot[n.id] = NEURO.reset;
      refUntil[n.id] = now() + NEURO.refractory;
      n.labelUntil = now() + 3.5;
      n.labelKind = "think";
      n.uses++;
    }
    mark(list[0]);
    var idx = 0;
    function nextHop() {
      if (idx >= hops.length) { if (onDone) onDone(); return; }
      var h = hops[idx++];
      var hl = h.link.id * 4;
      linkData[hl + 3] = 1;
      sendSignal(h.link, h.dir, NEURO.maxDepth, {
        speed: 1.3, color: COLOR_GOLD, alpha: 1, kind: "thought",
        onArrive: function () {
          // путь мысли — рабочий путь: связь крепнет, обрастает миелином, помнит работу
          linkData[hl] = Math.min(HEBB.linkMax, linkData[hl] + HEBB.linkGain * 1.5);
          link2Data[hl] = Math.min(1, link2Data[hl] + 0.05);
          link2Data[hl + 2] = 1;
          if (list.indexOf(h.to) >= 0) mark(h.to); else { neurData[h.to.id * 4 + 1] = Math.max(neurData[h.to.id * 4 + 1], 0.6); }
          nextHop();
        }
      });
    }
    nextHop();
    dirty = true;
  }

  // =======================================================
  // 7. ОШИБКИ И НАСТРОЕНИЕ
  // =======================================================
  function error(n, why) {
    if (!n) return;
    n.errors++;
    neur2Data[n.id * 4] = 1;
    n.labelUntil = now() + 4;
    n.labelKind = "err";
    feel.valence = -1;
    sound.error();
    // учится на ошибке: связи, которые только что работали, слабеют,
    // а та, что привела к ошибке, становится тормозящей — в следующий раз она гасит этот путь
    var culprit = null;
    for (var j = 0; j < lCount; j++) {
      var tr = link2Data[j * 4 + 2];
      if (tr < 0.05) continue;
      linkData[j * 4] = Math.max(HEBB.linkMin, linkData[j * 4] - 0.3 * tr);
    }
    n.links.forEach(function (l) { if (!culprit || link2Data[l.id * 4 + 2] > link2Data[culprit.id * 4 + 2]) culprit = l; });
    if (culprit && link2Data[culprit.id * 4 + 2] > 0.05) link2Data[culprit.id * 4 + 1] = 1;
    var pool = neurons.filter(function (m) { return m !== n && m.type === "skill" && !linkBetween(n, m) && neur2Data[m.id * 4 + 2] > 0.5; });
    if (pool.length) {
      pool.sort(function (u, v) { return u.base.distanceToSquared(n.base) - v.base.distanceToSquared(n.base); });
      var partner = pool[Math.floor(Math.random() * Math.min(4, pool.length))];
      setTimeout(function () { connect(n, partner); }, 900);
    }
    n.lastError = why || "";
    dirty = true;
    if (selected === n) showInfo(n);
  }
  // Успех: дофамин. Связи, работавшие последние секунды (у них есть след), получают награду.
  function success() {
    feel.valence = Math.max(feel.valence, 0.9);
    sound.success();
    for (var j = 0; j < lCount; j++) {
      var tr = link2Data[j * 4 + 2];
      if (tr < 0.05) continue;
      linkData[j * 4] = Math.min(HEBB.linkMax, linkData[j * 4] + 0.35 * tr);
      link2Data[j * 4] = Math.min(1, link2Data[j * 4] + 0.05 * tr);
      link2Data[j * 4 + 1] = 0;          // успешный путь больше не тормозящий
      link2Data[j * 4 + 3] = tr;         // тёплое свечение награды
    }
    dirty = true;
  }

  // =======================================================
  // 8. СТАРТ: сохранённый мозг или первые навыки
  // =======================================================
  var START = [
    ["Голос", "Слышит речь и отвечает голосом", ["голос", "скажи", "слышишь"]],
    ["Экран", "Делает скриншоты и видит, что на экране", ["экран", "скрин", "посмотри"]],
    ["Мышь", "Двигает мышь и кликает", ["клик", "нажми", "мыш"]],
    ["Клавиатура", "Печатает текст", ["напиши", "напечатай", "введи"]],
    ["Горячие клавиши", "Нажимает сочетания клавиш: копировать, вставить, Enter", ["клавиш", "сочетан", "скопируй", "вставь", "enter"]],
    ["Прокрутка", "Прокручивает страницу вверх и вниз", ["прокрут", "листай", "вниз", "вверх"]],
    ["Сайты", "Открывает сайты в браузере", ["сайт", "браузер", "ссылк", "google", "youtube"]],
    ["Программы", "Запускает приложения", ["открой", "запусти", "telegram", "программ"]],
    ["Команды", "Выполняет команды в терминале", ["команд", "терминал", "выполни"]],
    ["Файлы", "Ищет, читает и записывает файлы", ["файл", "найди", "папк", "документ"]],
    ["Система", "Время, ОС, размер экрана", ["время", "который час", "система"]]
  ];
  var KEYWORDS = {};
  START.forEach(function (s) { KEYWORDS[s[0]] = s[2]; });

  var STORE_KEY = "chloe-brain-v1";
  function r3(x) { return Math.round(x * 1000) / 1000; }
  // мозг для сохранения; drop — нейрон или список нейронов, которых в нём больше не будет (забытое, объединённое во сне)
  function serializeBrain(drop) {
    var drops = drop ? [].concat(drop) : [];
    var keep = neurons.filter(function (n) { return !n.gone && drops.indexOf(n) < 0; }), index = {};
    keep.forEach(function (n, i) { index[n.id] = i; });
    var used = [], zi = {};   // пустые зоны (тема распалась) не сохраняются
    zones.forEach(function (z) { if (keep.some(function (n) { return n.zone === z.name; }) || !z.topic) { zi[z.name] = used.length; used.push(z); } });
    return JSON.stringify({
      v: 2,
      zones: used.map(function (z) { return z.name; }),
      topics: used.filter(function (z) { return z.topic; }).map(function (z) { return z.name; }),
      neurons: keep.map(function (n) {
        return [n.name, n.type === "memory" ? 1 : 0, n.desc, zi[n.zone], r3(n.base.x), r3(n.base.y), r3(n.base.z),
          n.bornMs, n.uses, r3(neurData[n.id * 4]), n.errors, r3(n.dendScale), r3(n.scar || 0), n.world || 0, n.q || 0, n.lastMs || 0];
      }),
      links: links.filter(function (l) { return index[l.a.id] !== undefined && index[l.b.id] !== undefined; }).map(function (l) {
        return [index[l.a.id], index[l.b.id], r3(linkData[l.id * 4]), r3(link2Data[l.id * 4]), link2Data[l.id * 4 + 1] > 0.5 ? 1 : 0];
      })
    });
  }
  function save() {
    if (!dirty) return;
    dirty = false;
    try { storeSet(serializeBrain(null)); } catch (e) { /* хранилище недоступно — работаем без сохранения */ }
  }
  // в программе мозг хранится в файле через Python, в браузере — в localStorage
  function storeSet(str) {
    if (APP && window.pywebview && window.pywebview.api) { window.pywebview.api.save_brain(str); return; }
    try { localStorage.setItem(STORE_KEY, str); } catch (e) {}
  }
  function storeGet(cb) {
    if (!APP) { var raw = null; try { raw = localStorage.getItem(STORE_KEY); } catch (e) {} cb(raw); return; }
    var done = false;
    function fromApi() {
      if (done) return; done = true;
      window.pywebview.api.load_brain().then(function (raw) { cb(raw || null); }, function () { cb(null); });
    }
    if (window.pywebview && window.pywebview.api) fromApi();
    else window.addEventListener("pywebviewready", fromApi);
    setTimeout(function () {          // открыт с ?app=1 в обычном браузере — работаем без Python
      if (done) return; done = true;
      var raw = null; try { raw = localStorage.getItem(STORE_KEY); } catch (e) {} cb(raw);
    }, 4000);
  }
  function load(raw) {
    if (!raw) return false;
    try {
      var data = JSON.parse(raw);
      data.zones.forEach(function (z) { getZone(z); });
      (data.topics || []).forEach(function (z) { getZone(z).topic = true; });
      data.neurons.forEach(function (a) {
        createNeuron(a[0], a[1] ? "memory" : "skill", a[2], data.zones[a[3]], {
          base: (data.v || 1) >= 2 ? new THREE.Vector3(a[4], a[5], a[6]) : null, bornMs: a[7], uses: a[8], strength: a[9], errors: a[10] || 0,
          dendScale: a[11] || 1, grown: true, scar: a[12] || 0, world: a[13] || "", q: a[14] || "", lastMs: a[15] || 0
        });
      });
      data.links.forEach(function (a) {
        if (!neurons[a[0]] || !neurons[a[1]]) return;
        var old = a.length === 9;   // самый старый формат хранил изгиб связи
        var opt = { weight: old ? a[8] : a[2], born: -100, myelin: old ? 0 : (a[3] || 0), inhib: !old && a[4] === 1 };
        if (old) { opt.p1 = new THREE.Vector3(a[2], a[3], a[4]); opt.p2 = new THREE.Vector3(a[5], a[6], a[7]); }
        connect(neurons[a[0]], neurons[a[1]], opt);
      });
      dirty = false;
      return nCount > 0;
    } catch (e) { return false; }
  }
  setInterval(save, 4000);
  window.addEventListener("beforeunload", save);
  document.addEventListener("visibilitychange", function () { if (document.hidden) save(); });

  function findSkill(text) {
    var low = String(text).toLowerCase();
    var i, n;
    for (i = 0; i < nCount; i++) { n = neurons[i]; if (low === n.name.toLowerCase()) return n; }
    for (i = 0; i < nCount; i++) {
      n = neurons[i];
      if (low.indexOf(n.name.toLowerCase()) >= 0) return n;
      var kw = KEYWORDS[n.name] || [];
      for (var k = 0; k < kw.length; k++) if (low.indexOf(kw[k]) >= 0) return n;
    }
    return null;
  }
  function shortName(s) { return s.length > 26 ? s.slice(0, 25) + "…" : s; }

  // =======================================================
  // 9. ОТВЕТ CHLOE (демонстрация, пока не подключена Python-часть)
  // =======================================================
  var replyTimer = null;
  function respond(text, onThink, afterSpeak) {
    setState("thinking");
    replyEl.style.opacity = 0;
    clearTimeout(replyTimer);
    replyTimer = setTimeout(function () {
      var go = function () { speak(text, afterSpeak); };
      if (onThink) onThink(go); else go();
    }, 900);
  }
  function speak(text, after) {
    setState("speaking");
    replyEl.textContent = text; fitReply();
    replyEl.style.opacity = 1;
    var done = function () {
      voice.chloe = 0;
      setState("idle");
      if (after) after();
      setTimeout(function () { if (STATE.name !== "speaking") replyEl.style.opacity = 0; }, 2500);
    };
    if (sound.isOn() && window.speechSynthesis) {
      var u = new SpeechSynthesisUtterance(text);
      u.lang = "ru-RU";
      u.onend = done;
      u.onerror = done;
      speechSynthesis.cancel();
      speechSynthesis.speak(u);
    } else {
      setTimeout(done, 900 + text.length * 55);
    }
  }

  var cmd = document.getElementById("cmd");
  cmd.addEventListener("keydown", function (e) {
    if (e.key !== "Enter") return;
    var text = cmd.value.trim();
    cmd.value = "";
    if (!text) return;
    touch();
    if (APP && window.pywebview && window.pywebview.api) { window.pywebview.api.command(text); return; }
    var m = text.match(/^(запомни|запомнить|помни|научись|навык)[:,\s]+(.+)$/i);
    if (m) {
      var isSkill = /^(научись|навык)/i.test(m[1]);
      var n = addNeuron(shortName(m[2]), isSkill ? "skill" : "memory", (isSkill ? "Новый навык: " : "Воспоминание: ") + m[2]);
      respond(isSkill ? "Учусь: " + m[2] : "Запомнила.", function (go) {
        setTimeout(function () { fire(n); go(); }, 1200);
      }, success);
      return;
    }
    var hit = findSkill(text);
    var failed = /ошибк|не получ|сломай/i.test(text);
    if (hit) {
