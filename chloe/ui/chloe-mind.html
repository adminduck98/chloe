        var q = placed[p];
        if (Math.abs(x0 - q.x) * 2 < w0 + q.w && Math.abs(y0 - (q.y - 19)) < 14) return true;
      }
      return false;
    }
    // темы (зоны по смыслу) подписаны там, где лежат их нейроны; остальные зоны — в фильтрах, в сфере подписаны отделы мозга
    if (t - topicAt > 1) {
      topicAt = t; topicPos = {};
      for (var i2 = 0; i2 < nCount; i2++) {
        var nz = neurons[i2], z0 = zones[zoneIndex[nz.zone]];
        if (!z0 || !z0.topic || nz.gone) continue;
        var tp = topicPos[z0.name] || (topicPos[z0.name] = { v: new THREE.Vector3(), c: 0 });
        tp.v.add(nz.base); tp.c++;
      }
    }
    zones.forEach(function (z) {
      var tp = topicPos[z.name];
      if (!tp || !tp.c || wall) { put(z.el, "opacity", 0); return; }
      zp.copy(tp.v).multiplyScalar(1 / tp.c).multiplyScalar(1.12).applyMatrix4(group.matrixWorld);
      var front = clamp((camera.position.z - zp.distanceTo(camera.position)) / 1.2 + 0.5, 0, 1);
      zp.project(camera);
      var zx = (zp.x + 1) / 2 * viewW, zy = (1 - zp.y) / 2 * viewH;
      put(z.el, "left", Math.round(zx) + "px");
      put(z.el, "top", Math.round(zy) + "px");
      var zShow = zp.z < 1 && !underLabel(zx, zy, z.name);
      if (zShow) placed.push({ x: zx, y: zy + 19, w: z.name.length * 7.5 });   // темы тоже не налезают друг на друга
      put(z.el, "opacity", zShow ? (0.35 + 0.65 * front).toFixed(2) : 0);
    });
    placeCoreLabels(placed, wall);   // ядро и слои — до отделов: отделы уступают им место
    Object.keys(regionEls).forEach(function (key) {
      var el = regionEls[key];
      regionPos(key, zp).applyMatrix4(group.matrixWorld);
      var front = clamp((camera.position.z - zp.distanceTo(camera.position)) / 1.2 + 0.5, 0, 1);
      zp.project(camera);
      var rx = (zp.x + 1) / 2 * viewW, ry = (1 - zp.y) / 2 * viewH;
      put(el, "left", Math.round(rx) + "px");
      put(el, "top", Math.round(ry) + "px");
      var rShow = !wall && zp.z < 1 && !underLabel(rx, ry, el.textContent);
      if (rShow) placed.push({ x: rx, y: ry + 19, w: el.textContent.length * 7.5 });   // и подписи отделов не налезают друг на друга
      put(el, "opacity", rShow ? (0.25 + 0.75 * front).toFixed(2) : 0);
      put(el, "pointerEvents", rShow ? "auto" : "none");   // спрятанная подпись не ловит клики
    });
  }

  // =======================================================
  // 21. API ДЛЯ PYTHON-ЧАСТИ CHLOE
  //   chloeLearn(name, type, desc, zone)     — новый навык/память
  //   chloeRemember(text, zone)              — новое воспоминание
  //   chloeUse(name)                         — использовать навык
  //   chloeThink(["Экран", "Программы", "Мышь"], onDone) — показать ход мыслей
  //   chloeError(name, why)                  — ошибка: красная вспышка, перестройка связи
  //   chloeSuccess()                         — тёплая волна
  //   chloeState("idle"|"listening"|"thinking"|"speaking"|"sleeping")
  //   chloeVoice(0..1, "user"|"chloe"), chloeSay(text)
  //   chloeFocus(text)                       — найти и подлететь
  //   chloeDemoFill(n), chloeReset()
  // =======================================================
  window.chloeLearn = function (name, type, desc, zone) { touch(); var n = addNeuron(shortName(name), type || "skill", desc || "", zone); return n ? n.id : -1; };
  window.chloeRemember = function (text, zone) { touch(); var n = addNeuron(shortName(text), "memory", "Воспоминание: " + text, zone || "Память"); return n ? n.id : -1; };
  window.chloeUse = function (name) { touch(); var n = findSkill(name); fire(n); if (n) n.working = Date.now(); };

  // ---- мозг как карта реального опыта ----
  // связь между навыками рождается и крепнет, когда они работают в одной задаче друг за другом;
  // программы, сайты, папки, с которыми Chloe работала, становятся нейронами и связаны с навыками, которыми она их трогала
  var task = { prev: null, chain: [] };
  function bond(a, b, gain) {
    var l = linkBetween(a, b) || connect(a, b, { weight: HEBB.linkStart });
    if (!l) return null;
    var li = l.id * 4;
    linkData[li] = Math.min(HEBB.linkMax, linkData[li] + gain);
    link2Data[li] = Math.min(1, link2Data[li] + 0.06);   // миелин: часто вместе — толще и быстрее «тропа»
    link2Data[li + 1] = 0;
    link2Data[li + 2] = 1;                                // след — для дофамина после успеха
    return l;
  }
  function stepSpeed(seconds) { return 1 / clamp(seconds || 0.5, 0.25, 6); }   // сигнал идёт по связи столько, сколько шёл шаг
  function worldNeuron(t) {
    for (var i = 0; i < nCount; i++) if (neurons[i].world && neurons[i].name === t.name) return neurons[i];
    var n = createNeuron(t.name, "memory", t.desc || t.kind, t.zone || t.kind, { world: t.kind, q: t.q || t.name });
    if (n) { shellFlash(n.base); sound.click(1040); }
    return n;
  }
  window.chloeTask = function () {   // новая просьба — новая цепочка; прошлая уходит в эпизоды для повтора во сне
    if (task.chain.length > 1) { episodes.push(task.chain.slice()); if (episodes.length > 40) episodes.shift(); }
    task.prev = null; task.chain = [];
  };
  window.chloeStep = function (name, seconds, ok, things) {
    touch();
    var n = findSkill(name);
    if (!n) return;
    n.working = 0;
    n.lastMs = Date.now();
    if (task.prev && task.prev !== n) {
      var l = bond(task.prev, n, 0.12);
      if (l) sendSignal(l, l.a === task.prev ? 1 : -1, 1, { speed: stepSpeed(seconds), kind: "path", alpha: 0.95 });
    }
    (things || []).forEach(function (t) {
      var w = worldNeuron(t);
      if (!w) return;
      w.uses++; w.lastMs = Date.now();
      neurData[w.id * 4] = Math.min(HEBB.max, neurData[w.id * 4] + HEBB.gain * 0.5);
      w.labelUntil = Math.max(w.labelUntil, now() + 3);
      var lw = bond(n, w, 0.08);
      if (lw) sendSignal(lw, lw.a === n ? 1 : -1, 1, { speed: stepSpeed(seconds), kind: "path" });
    });
    if (ok === false) n.scar = Math.min(1, (n.scar || 0) + 0.34);
    else { n.scar = (n.scar || 0) * 0.75; if (n.scar < 0.03) n.scar = 0; }
    task.prev = n;
    if (task.chain[task.chain.length - 1] !== n) task.chain.push(n);
    dirty = true;
    if (selected === n) showInfo(n);
  };
  // вспомнила: воспоминание, которое пригодилось в ответе, загорается зелёным
  // постоянное зрение: окно сменилось — нейрон «Экран» вздрагивает (без укрепления связей: это взгляд, а не действие)
  window.chloeGlance = function () {
    if (document.hidden) return;
    for (var i = 0; i < nCount; i++) {
      var n = neurons[i];
      if (n.name === "Экран" && !n.gone) {
        spike(n, null, 0.6);
        n.labelUntil = Math.max(n.labelUntil, now() + 1.5);
        return;
      }
    }
  };
  window.chloeRecall = function (text) {
    touch();
    var n = memoryNeuron(text);
    if (!n) return;
    n.uses++; n.lastMs = Date.now();
    n.labelUntil = now() + 4; n.labelKind = "recall";
    neurData[n.id * 4] = Math.min(HEBB.max, neurData[n.id * 4] + HEBB.gain);
    neurData[n.id * 4 + 1] = 1;
    n.links.forEach(function (l) { sendSignal(l, l.a === n ? 1 : -1, 1, { color: SIG_RECALL, kind: "recall", alpha: 0.9 }); });
    if (task.prev) { var l = bond(n, task.prev, 0.05); if (l) sendSignal(l, l.a === n ? 1 : -1, 1, { color: SIG_RECALL, kind: "recall" }); }
    dirty = true;
  };
  // «покажи, как ты это сделала»: путь прошлой задачи шаг за шагом, в настоящих пропорциях времени
  var replaying = false;
  window.chloeReplay = function (title, steps) {
    touch();
    if (replaying || !steps || !steps.length) return;
    replaying = true;
    replyEl.classList.add("heard"); replyEl.textContent = "Повтор: «" + title + "»"; replyEl.style.opacity = 1;
    var total = steps.reduce(function (a, s) { return a + (s.seconds || 0.5); }, 0);
    var k = total > 12 ? 12 / total : 1;          // длинную задачу сжимаем до ~12 секунд, пропорции сохраняются
    var prev = null, i = 0;
    function next() {
      if (i >= steps.length) { replaying = false; setTimeout(function () { replyEl.style.opacity = 0; }, 2500); return; }
      var s = steps[i++], n = findSkill(s.skill);
      var dur = Math.max(0.35, (s.seconds || 0.5) * k);
      if (n) {
        neurData[n.id * 4 + 1] = 1;                 // повтор только показывает: силу и счётчик не меняет
        n.labelUntil = now() + dur + 1.5; n.labelKind = "think";
        if (prev && prev !== n) {
          var l = linkBetween(prev, n);
          if (l) sendSignal(l, l.a === prev ? 1 : -1, 1, { speed: 1 / dur, kind: "path", color: COLOR_GOLD, alpha: 1 });
        }
        (s.things || []).forEach(function (t) {
          for (var j = 0; j < nCount; j++) if (neurons[j].world && neurons[j].name === t.name) {
            neurons[j].labelUntil = now() + dur + 1.5;
            var lw = linkBetween(n, neurons[j]);
            if (lw) sendSignal(lw, lw.a === n ? 1 : -1, 1, { speed: 1 / dur, kind: "path" });
          }
        });
        if (s.ok === false) { neur2Data[n.id * 4] = 1; n.labelKind = "err"; }
        prev = n;
      }
      setTimeout(next, dur * 1000);
    }
    next();
  };
  window.chloeThink = function (steps, onDone) { touch(); think(steps, onDone); };
  window.chloeError = function (name, why) { touch(); error(findSkill(name), why); };
  window.chloeSuccess = function () { touch(); success(); };
  window.chloeState = function (name) {
    if (name !== "sleeping") touch();
    setState(name);
    if (name === "idle") setTimeout(function () { if (STATE.name === "idle") replyEl.style.opacity = 0; }, 3500);
  };
  window.chloeVoice = function (v, who) { voice[who === "chloe" ? "chloe" : "user"] = clamp(v, 0, 1); };
  window.chloeSay = function (text) { touch(); speak(text); };
  window.chloeReply = function (text) {         // Chloe говорит: текст под мозгом, состояние «говорит» до chloeState("idle")
    touch(); setState("speaking");
    replyEl.classList.remove("heard"); replyEl.textContent = text; fitReply(); replyEl.style.opacity = 1;
  };
  window.chloeHeard = function (text) {          // что Chloe услышала
    touch();
    replyEl.classList.add("heard"); replyEl.textContent = "«" + text + "»"; fitReply(); replyEl.style.opacity = 1;
  };
  window.chloeEnsure = function (name, type, desc, zone) {   // навык есть — ничего; нет — вырастить
    for (var i = 0; i < nCount; i++) if (neurons[i].name === name) return neurons[i].id;
    var n = addNeuron(name, type || "skill", desc || "", zone); return n ? n.id : -1;
  };
  window.chloeFocus = function (text) { touch(); searchInput.value = text; applySearch(text, true); };
  window.chloeDemoFill = function (count) {
    var zs = ["Компьютер", "Интернет", "Магазин", "Люди", "Личное", "Работа", "Память"];
    for (var i = 0; i < count; i++) {
      var mem = Math.random() < 0.6;
      var z = zs[Math.floor(Math.random() * zs.length)];
      var n = addNeuron((mem ? "Память " : "Навык ") + (nCount + 1), mem ? "memory" : "skill", "Тестовый нейрон", z);
      if (!n) break;
      n.labelUntil = 0;
      neurData[n.id * 4] = rnd(HEBB.min, HEBB.max);
      n.bornMs = Date.now() - Math.random() * 7 * 864e5;
    }
  };
  window.chloeReset = function () {
    try { localStorage.removeItem(STORE_KEY); } catch (e) {}
    if (APP && window.pywebview && window.pywebview.api) window.pywebview.api.save_brain("");
    dirty = false;
    window.removeEventListener("beforeunload", save);
    location.reload();
  };

  // =======================================================
  // 22. РАЗМЕР И АНИМАЦИЯ
  // =======================================================
  function resize() {
    var w = Math.max(wrap.clientWidth, 1), h = Math.max(wrap.clientHeight, 1);
    renderer.setSize(w, h, false);
    camera.aspect = w / h;
    BASE_Z = w / h < 0.8 ? 6.0 : 4.9;
    camera.updateProjectionMatrix();
    common.uProj.value = (h * DPR) / (2 * Math.tan(FOV * Math.PI / 360));
  }
  window.addEventListener("resize", resize);

  var nextIdle = 3, nextThink = 0, last = 0, tw = 0;
  var tmpP = new THREE.Vector3(), tmpC = new THREE.Color();
  var zoomLvl = document.getElementById("zoomLvl");
  var lastFrame = performance.now();
  var statEls = { n: document.getElementById("sN"), l: document.getElementById("sL"), z: document.getElementById("sZ"), s: document.getElementById("sS") };

  var perf = { js: 0, frames: 0 };
  // в видеокарту — только занятые строки таблиц (раньше каждый кадр уходили все 2,5 МБ, даже для 20 нейронов)
  function uploadRows(tex, data, size, count) {
    var p = renderer.properties.get(tex);
    if (!p.__webglTexture || p.__version !== tex.version) { tex.needsUpdate = true; return; }   // первая загрузка — целиком
    var gl = renderer.getContext(), rows = Math.min(size, Math.max(1, Math.ceil(count / size)));
    renderer.state.bindTexture(gl.TEXTURE_2D, p.__webglTexture);
    gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL, false);
    gl.pixelStorei(gl.UNPACK_PREMULTIPLY_ALPHA_WEBGL, false);
    gl.pixelStorei(gl.UNPACK_ALIGNMENT, 4);
    gl.texSubImage2D(gl.TEXTURE_2D, 0, 0, 0, size, rows, gl.RGBA, gl.FLOAT, data.subarray(0, rows * size * 4));
  }
  window.chloePerf = function () {   // замер скорости: кадров в секунду, мс JS на кадр, уровень качества
    return { fps: Math.round(quality.fps * 10) / 10, jsMs: Math.round(perf.js * 100) / 100, level: quality.level, neurons: nCount, links: lCount };
  };
  // самозамер: n кадров подряд, с ожиданием видеокарты (gl.finish) — честное время кадра, даже если окно не видно
  window.chloeBench = function (n, hide, lod) {
    if (lod !== undefined) axLod(lod);
    var parts = { shell: shell, dust: dust, soma: somaPoints, dend: dendLines, axons: axMesh, sig: sigPoints, group: group }, was = {};
    (hide || []).forEach(function (k) { if (parts[k]) { was[k] = parts[k].visible; parts[k].visible = false; } });
    if ((hide || []).indexOf("haze") >= 0) haze.forEach(function (h) { h.visible = false; });
    var gl = renderer.getContext(), t0 = performance.now();
    for (var i = 0; i < (n || 60); i++) { frame(performance.now(), true); gl.finish(); }
    Object.keys(was).forEach(function (k) { parts[k].visible = was[k]; });
    if ((hide || []).indexOf("haze") >= 0) haze.forEach(function (h) { h.visible = quality.level > 0; });
    if (lod !== undefined) axLod(quality.level);
    return Math.round((performance.now() - t0) / (n || 60) * 100) / 100;
  };
  // в покое незачем 60 кадров: 30, во сне 20 — меньше нагрев и батарея; любое действие сразу возвращает полную частоту
  var lastDraw = 0;
  function animate() {
    requestAnimationFrame(animate);
    var nowMs = performance.now();
    var calm = !signals.length && !synFlashes.length && !dragging && !playing && !replaying && now() - lastActivity > 4 &&
               (STATE.name === "idle" || STATE.name === "sleeping");
    var gap = calm ? (STATE.name === "sleeping" ? 50 : 33) : 0;
    if (gap && nowMs - lastDraw < gap - 4) return;
    lastDraw = nowMs;
    frame(nowMs, false, calm);   // ограниченная частота — не повод менять качество
  }
  function frame(nowMs, bench, calm) {
    if (!bench && !calm) trackQuality(nowMs - lastFrame);
    lastFrame = nowMs;
    var t = now();
    var dt = Math.min(t - last, 0.05);
    last = t;

    readMic(t);
    sleepTick(t, dt);
    eegTick(t, dt);
    updatePlay();

    mood.think = approach(mood.think, STATE.name === "thinking" ? 1 : 0, 3, dt);
    mood.speak = approach(mood.speak, STATE.name === "speaking" ? 1 : 0, 3, dt);
    mood.listen = approach(mood.listen, STATE.name === "listening" ? 1 : 0, 4, dt);
    mood.sleep = approach(mood.sleep, STATE.name === "sleeping" ? 1 : 0, 0.6, dt);
    common.uDeep.value = approach(common.uDeep.value, STATE.name === "sleeping" && stage.key === "N3" ? 1 : 0, 0.8, dt);

    // настроение: тепло/холод уходит, усталость копится в работе
    feel.valence = approach(feel.valence, 0, 0.35, dt);
    var busy = STATE.name === "thinking" || STATE.name === "speaking";
    feel.fatigue = clamp(feel.fatigue + (busy ? 0.03 : (STATE.name === "sleeping" ? -0.05 : -0.008)) * dt + signals.length * 0.00002 * dt, 0, 1);
    tmpC.copy(SHELL_BASE);
    if (feel.valence > 0) tmpC.lerp(SHELL_WARM, feel.valence * 0.75);
    else tmpC.lerp(SHELL_COLD, -feel.valence * 0.8);
    tmpC.lerp(SHELL_SLEEP, mood.sleep * 0.7);
    shellUniforms.uBase.value.copy(tmpC);
    shellUniforms.uHot.value.copy(tmpC).lerp(COLOR_HOT, 0.35);   // свет волны — того же оттенка, что и сфера
    common.uBright.value = 1 - 0.4 * feel.fatigue - 0.35 * mood.sleep;
    tw += dt * (1 - 0.6 * feel.fatigue - 0.6 * mood.sleep);
    shellUniforms.uTw.value = tw;

    if (STATE.name === "speaking") {
      var syl = 0.5 + 0.5 * Math.sin(t * 13) * Math.sin(t * 5.3 + 1);
      voice.chloe = approach(voice.chloe, 0.35 + 0.65 * syl, 12, dt);
      if (t > nextWave) { emitWave(t); nextWave = t + 0.45 - 0.2 * voice.chloe; }
    } else if (STATE.name === "listening" && voice.user > 0.1 && t > nextWave) {
      emitWave(t); nextWave = t + 0.75 - 0.25 * voice.user;   // вы говорите — по сфере тоже идут волны, реже и мягче
    }

    // мозг растёт вместе с опытом; камера
    var sc = approach(group.scale.x, brainScale(), 0.8, dt);
    group.scale.setScalar(sc);
    camera.position.z = approach(camera.position.z, camZ(view.zoom), view.focus ? 3 : 7, dt);
    camera.position.x = approach(camera.position.x, view.panX, 7, dt);
    camera.position.y = approach(camera.position.y, view.panY, 7, dt);
    put(zoomLvl, "textContent", Math.round(view.zoom * 100) + "%");
    common.uZoom.value = camZ(1) / Math.max(camera.position.z, 0.05);
    common.uScaleW.value = sc;
    common.uDens.value = approach(common.uDens.value, density(), 0.8, dt);
    // чем больше клеток, тем прозрачнее каждая — чтобы тысячи не сливались в пятно
    common.uCrowdK.value = approach(common.uCrowdK.value, Math.min(1, Math.pow(800 / Math.max(nCount, 1), 0.82)), 0.8, dt);

    // вращение
    if (view.focus) {
      rot.y = approachAngle(rot.y, view.focus.yaw, 2.5, dt);
      rot.x = approach(rot.x, view.focus.pitch, 2.5, dt);
    } else if (!dragging) {
      rot.y += rot.vy; rot.x += rot.vx; rot.vy *= 0.95; rot.vx *= 0.95;
      rot.y += dt * (0.08 + 0.05 * mood.think) * (1 - 0.7 * mood.sleep);
    }
    // лёгкое покачивание — мозг живой, а не закреплён
    group.rotation.set(rot.x + 0.035 * Math.sin(t * 0.21), rot.y, 0.02 * Math.sin(t * 0.17 + 1.3));
    group.updateMatrixWorld();

    coreUpdate(t, dt);
    drift.amp = 0.035 * (1 + 0.6 * mood.think) * (1 - 0.5 * mood.sleep) * (0.6 + 0.4 * common.uDens.value);
    common.uDrift.value = drift.amp;

    // нейроны: угасание, остывание, видимость (фильтр + машина времени), ошибки гаснут
    for (var i = 0; i < nCount; i++) {
      var o4 = i * 4, n = neurons[i];
      neurData[o4] = Math.max(HEBB.min, neurData[o4] - HEBB.decay * dt);
      neurData[o4 + 1] = Math.max(0, neurData[o4 + 1] - dt * 0.9);
      neur2Data[o4] = Math.max(0.28 * n.scar, neur2Data[o4] - dt * 0.25);   // шрам не гаснет до успешной работы
      if (n.working) {
        if (Date.now() - n.working > 120000) n.working = 0;                  // шаг пропал — не светить вечно
        else neurData[o4 + 1] = Math.max(neurData[o4 + 1], 0.55);            // навык занят прямо сейчас
      }
      vPot[i] += (0 - vPot[i]) * Math.min(1, NEURO.leak * dt);      // заряд стекает к покою
      neur2Data[o4 + 3] = vPot[i];
      var visT = (!n.gone && filterVisible(n) && n.bornMs <= timeCut) ? 1 : 0;
      neur2Data[o4 + 2] = approach(neur2Data[o4 + 2], visT, 4, dt);
    }
    for (var j = 0; j < lCount; j++) {
      var l4 = j * 4;
      linkData[l4] = Math.max(HEBB.linkMin, linkData[l4] - HEBB.linkDecay * dt);
      linkData[l4 + 1] = Math.max(0, linkData[l4 + 1] - dt * 1.5);
      linkData[l4 + 3] = Math.max(0, linkData[l4 + 3] - dt * 0.35);
      link2Data[l4] = Math.max(0, link2Data[l4] - 0.0003 * dt);              // миелин держится долго
      link2Data[l4 + 2] *= Math.exp(-dt / NEURO.traceTau);                    // след работы
      link2Data[l4 + 3] = Math.max(0, link2Data[l4 + 3] - dt * 0.6);         // свечение награды
    }

    // сигналы
    for (var s = signals.length - 1; s >= 0; s--) {
      var sg = signals[s];
      sg.t += sg.dir * sg.speed * dt / sg.link.len;
      linkData[sg.link.id * 4 + 1] = Math.max(linkData[sg.link.id * 4 + 1], 0.8 * sg.alpha);
      if (sg.t >= 1 || sg.t <= 0) {
        signals.splice(s, 1);
        deliver(sg);
        if (sg.onArrive) sg.onArrive();
      }
    }
    var cnt = 0;
    for (var q = 0; q < signals.length; q++) {
      var sq = signals[q];
      for (var tr = 0; tr < TRAIL; tr++) {
        var tt = clamp(sq.t - sq.dir * tr * 0.011, 0, 1);
        linkPoint(sq.link, tt, t, tmpP);
        sigPos[cnt * 3] = tmpP.x; sigPos[cnt * 3 + 1] = tmpP.y; sigPos[cnt * 3 + 2] = tmpP.z;
        var fade = 1 - tr / TRAIL;
        sigA[cnt] = (tr === 0 ? 1 : 0.8 * fade * fade) * sq.alpha;   // хвост гаснет плавно, голова — яркая
        sigCol[cnt * 3] = sq.color.r; sigCol[cnt * 3 + 1] = sq.color.g; sigCol[cnt * 3 + 2] = sq.color.b;
        cnt++;
      }
    }
    // вспышки синапсов: короткое свечение на конце аксона в момент передачи
    for (var sf = synFlashes.length - 1; sf >= 0; sf--) {
      var fl = synFlashes[sf], age = t - fl.born;
      if (age > 0.45) { synFlashes.splice(sf, 1); continue; }
      if (cnt >= MAX_S * TRAIL) break;
      linkPoint(fl.link, fl.end ? 0.97 : 0.03, t, tmpP);
      sigPos[cnt * 3] = tmpP.x; sigPos[cnt * 3 + 1] = tmpP.y; sigPos[cnt * 3 + 2] = tmpP.z;
      sigA[cnt] = (1 - age / 0.45) * fl.alpha;
      sigCol[cnt * 3] = fl.color.r; sigCol[cnt * 3 + 1] = fl.color.g; sigCol[cnt * 3 + 2] = fl.color.b;
      cnt++;
    }
    sigGeo.attributes.position.needsUpdate = true;
    sigGeo.attributes.aA.needsUpdate = true;
    sigGeo.attributes.aCol.needsUpdate = true;
    sigGeo.setDrawRange(0, cnt);

    // Свет только от настоящей работы: случайных вспышек в покое, при размышлении и во сне нет.

    uploadRows(neurTex, neurData, NT, nCount);
    uploadRows(neur2Tex, neur2Data, NT, nCount);
    uploadRows(linkTex, linkData, LT, lCount);
    uploadRows(link2Tex, link2Data, LT, lCount);

    haze.forEach(function (h) {
      var u = h.userData;
      h.position.set(
        u.base.x + 0.12 * Math.sin(t * 0.07 + u.ph),
        u.base.y + 0.1 * Math.sin(t * 0.05 + u.ph * 2),
        u.base.z + 0.12 * Math.sin(t * 0.06 + u.ph * 3)
      );
      h.material.opacity = u.op * (1 + 0.8 * mood.think + 0.6 * mood.speak) * common.uBright.value;
    });

    updateLabels(t);
    put(statEls.n, "textContent", nCount); put(statEls.l, "textContent", lCount);
    put(statEls.z, "textContent", zones.length); put(statEls.s, "textContent", signals.length);

    common.uTime.value = t;
    common.uSpeak.value = mood.speak;
    common.uChloe.value = voice.chloe;
    common.uThink.value = mood.think;
    common.uSleep.value = mood.sleep;
    shellUniforms.uEnergy.value = 0.3 + 0.35 * mood.think + 0.15 * mood.speak - 0.15 * mood.sleep;
    shellUniforms.uListen.value = voice.user * (0.4 + 0.6 * mood.listen);
    shellUniforms.uVoice.value = Math.max(voice.chloe * mood.speak, 0.6 * voice.user * mood.listen);
    renderer.render(scene, camera);
    perf.js = perf.js * 0.95 + (performance.now() - nowMs) * 0.05;
  }

  // ---------- центр управления: ядро, слои и отделы открывают слои системы ----------
  var corePanel = document.getElementById("corePanel"), coreOpen = false, coreTimer = null, coreStatus = null;
  var STATE_RU = { idle: "Спокойна", listening: "Слушает", thinking: "Думает", speaking: "Говорит", sleeping: "Спит" };
  function closeCore() {
    coreOpen = false;
    corePanel.style.display = "none";
    if (coreTimer) { clearInterval(coreTimer); coreTimer = null; }
  }
  function openCore() {
    touch();
    info.style.display = "none"; selected = null;
    if (statsOpen) toggleStats(false);
    closeJournal(); closeMemory(); closeFiles();
    if (phonePanel) closePhone();
    coreOpen = true;
    corePanel.style.display = "block";
    renderCore();
    fetchCoreStatus();
    if (!coreTimer) coreTimer = setInterval(function () { renderCore(); }, 700);
  }
  // расход за сегодня — всегда в шапке: сколько стоили запросы к моделям (обновляется каждые 15 секунд)
  var spendBtn = document.getElementById("spendBtn");
  function fetchSpend() {
    var api = window.pywebview && window.pywebview.api && window.pywebview.api.system_status ? window.pywebview.api : null;
    if (!api) return;
    api.system_status().then(function (st) {
      if (!st || !st.today) return;
      var usd = Number(st.today.usd) || 0;
      spendBtn.textContent = "сегодня $" + (usd < 1 ? usd.toFixed(3) : usd.toFixed(2));
      spendBtn.title = "Сегодня " + st.today.calls + " запросов к моделям ≈ $" + usd.toFixed(4) +
        " (оценка по прайсу; точный счёт — в кабинетах Anthropic и DeepSeek; Qwen по подписке Token Plan в сумму не входит —" +
        " его кредиты видны в консоли Alibaba). Нажмите — подробнее в ядре.";
      spendBtn.hidden = false;
    }).catch(function () {});
  }
  spendBtn.addEventListener("click", function () { openCore(); });
  window.addEventListener("pywebviewready", fetchSpend);
  setTimeout(fetchSpend, 1500);
  setInterval(fetchSpend, 15000);
  function fetchCoreStatus() {
    var api = window.pywebview && window.pywebview.api && window.pywebview.api.system_status ? window.pywebview.api : null;
    if (!api) { coreStatus = null; return; }
    api.system_status().then(function (st) { coreStatus = st; renderCore(); }).catch(function () {});
  }
  function esc(t) { return String(t == null ? "" : t).replace(/[&<>"]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]; }); }
  function renderCore() {
    if (!coreOpen) return;
    var st = coreStatus, h = [];
    h.push("<span class='close' role='button' aria-label='Закрыть' data-act='close'>×</span><b>Ядро Chloe</b>");
    h.push("<div class='cState'>" + esc(STATE_RU[STATE.name] || STATE.name) + "</div>");
    h.push("<div class='cMuted'>сосредоточенность " + Math.round(eeg.focus * 100) + "% · усталость " + Math.round(feel.fatigue * 100) + "%</div>");
    h.push("<h4>Слои</h4>");
    LAYERS.forEach(function (L) {
      var a = L.uni.uAct.value, hot = a > 0.35;
      h.push("<div class='cLayer" + (hot ? " hot" : "") + "'><button data-open='" + L.opens + "'>" + esc(L.name) + " →</button>" +
             "<span class='track'><i style='width:" + Math.round(8 + a * 92) + "%'></i></span><small>" + Math.round(a * 100) + "%</small></div>");
    });
    h.push("<h4>Мозг</h4>");
    h.push("<div class='cRow'><span>Нейроны</span><span>" + nCount + "</span></div>");
    h.push("<div class='cRow'><span>Связи</span><span>" + lCount + "</span></div>");
    h.push("<div class='cRow'><span>Темы</span><span>" + zones.length + "</span></div>");
    if (st) {
      h.push("<h4>Подключённые модели</h4>");
      h.push("<div class='cRow'><span>Быстрый мозг</span><span>" + esc(st.fast) + "</span></div>");
      h.push("<div class='cRow'><span>Сильный мозг</span><span>" + esc(st.strong) + "</span></div>");
      if (st.eyes) h.push("<div class='cRow'><span>Глаза</span><span>" + esc(st.eyes) + "</span></div>");
      h.push("<div class='cRow'><span>Сегодня</span><span>" + st.today.calls + " запросов · ≈$" + Number(st.today.usd).toFixed(3) + "</span></div>");
      h.push("<h4>Система</h4>");
      h.push("<div class='cRow'><span>Зрение</span><span>" + (!st.vision.on ? "выключено" : st.vision.private ? "приватное окно — не смотрит" : esc(st.vision.title || "включено")) + "</span></div>");
      h.push("<div class='cRow'><span>Воспоминаний</span><span>" + st.memory + "</span></div>");
      h.push("<div class='cRow'><span>Навыков</span><span>" + st.skills + "</span></div>");
      h.push("<div class='cRow'><span>Напоминаний</span><span>" + st.reminders + "</span></div>");
    } else {
      h.push("<h4>Модели и система</h4><div class='cMuted'>Подробности появятся, когда мозг открыт из программы Chloe — через run.py.</div>");
    }
    h.push("<h4>Открыть</h4><div>" +
      "<button class='small' data-open='journal'>Журнал</button><button class='small' data-open='memory'>Память</button>" +
      "<button class='small' data-open='files'>Файлы</button><button class='small' data-open='stats'>Статистика</button></div>");
    corePanel.innerHTML = h.join("");
  }
  corePanel.addEventListener("click", function (e) {
    var t = e.target.closest("[data-open],[data-act]");
    if (!t) return;
    if (t.getAttribute("data-act") === "close") { closeCore(); return; }
    openLayer(t.getAttribute("data-open"));
  });
  function openLayer(what) {
    touch();
    if (what === "core") { if (coreOpen) closeCore(); else openCore(); return; }
    closeCore();
    if (what === "memory") { if (!mState.open) openMemory(); }
    else if (what === "journal") { if (!jState.open) openJournal(""); }
    else if (what === "files") { if (!fState.open) openFiles(); }
    else if (what === "stats") { if (!statsOpen) toggleStats(true); }
  }
  // любая другая панель открылась — панель ядра закрывается
  document.getElementById("toggles").addEventListener("click", function () { closeCore(); }, true);
  // главные отделы подписаны сразу, ещё до первых нейронов: это кнопки центра управления
  ["stem", "thal", "hippo", "frontal", "motor", "temporalL"].forEach(regionLabel);

  // подписи слоёв и ядра — кнопки поверх мозга
  var layerEls = LAYERS.map(function (L) {
    var b = document.createElement("button");
    b.type = "button"; b.className = "layer"; b.textContent = L.name;
    b.title = L.name + " — открыть: " + REGION_HINT[L.opens];
    b.addEventListener("pointerdown", function (e) { e.stopPropagation(); });
    b.addEventListener("click", function (e) { e.stopPropagation(); openLayer(L.opens); });
    wrap.appendChild(b);
    return b;
  });
  var coreLabel = document.createElement("button");
  coreLabel.type = "button"; coreLabel.id = "coreLabel"; coreLabel.textContent = "Ядро";
  coreLabel.title = "Ядро Chloe — состояние, модели, слои";
  coreLabel.addEventListener("pointerdown", function (e) { e.stopPropagation(); });
  coreLabel.addEventListener("click", function (e) { e.stopPropagation(); openLayer("core"); });
  wrap.appendChild(coreLabel);
  var _lp = new THREE.Vector3();
  function placeCoreLabels(placed, wall) {
    var clean = document.body.classList.contains("clean");
    _lp.copy(CORE_POS).applyMatrix4(group.matrixWorld).project(camera);
    var cx = (_lp.x + 1) / 2 * viewW, cy = (1 - _lp.y) / 2 * viewH;
    put(coreLabel, "left", Math.round(cx) + "px");
    put(coreLabel, "top", Math.round(cy + 18) + "px");
    put(coreLabel, "opacity", wall ? 0 : 1);
    placed.push({ x: cx, y: cy + 46, w: 50 });
    LAYERS.forEach(function (L, i) {
      var b = layerEls[i];
      if (wall || clean) { put(b, "opacity", 0); put(b, "pointerEvents", "none"); return; }
      L.holder.updateMatrixWorld();
      _lp.copy(L.anchor); L.holder.localToWorld(_lp); _lp.project(camera);
      var x = (_lp.x + 1) / 2 * viewW, y = (1 - _lp.y) / 2 * viewH, w = L.name.length * 8;
      var hidden = _lp.z > 1 || placed.some(function (q) { return Math.abs(x - q.x) * 2 < w + q.w && Math.abs(y - (q.y - 19)) < 14; });
      put(b, "left", Math.round(x) + "px");
      put(b, "top", Math.round(y) + "px");
      put(b, "opacity", hidden ? 0 : 1);
      put(b, "pointerEvents", hidden ? "none" : "auto");
      put(b, "className", "layer" + (L.uni.uAct.value > 0.35 ? " hot" : ""));
      if (!hidden) placed.push({ x: x, y: y + 19, w: w });
    });
  }

  // ---------- слои ядра оживают от событий Chloe ----------
  (function () {
    var DATA_SKILLS = { "Файлы": 1, "Управление файлами": 1, "Загрузки": 1, "Сайты": 1, "Поиск в интернете": 1, "Буфер обмена": 1, "Telegram": 1 };
    function wrapFn(name, before) {
      var orig = window[name];
      if (typeof orig !== "function") return;
      window[name] = function () { try { before.apply(null, arguments); } catch (e) {} return orig.apply(this, arguments); };
    }
    wrapFn("chloeUse", function (skill) { coreKick("proc", 0.35); if (DATA_SKILLS[skill]) coreKick("data", 0.45); });
    wrapFn("chloeStep", function (skill, sec, ok) { coreKick("proc", 0.2); if (DATA_SKILLS[skill]) coreKick("data", 0.25); });
    wrapFn("chloeRemember", function () { coreKick("mem", 0.6); });
    wrapFn("chloeRecall", function () { coreKick("mem", 0.7); });
    wrapFn("chloeHeard", function () { coreKick("think", 0.4); });
    wrapFn("chloeReply", function () { coreKick("think", 0.25); });
  })();

  // ---------- запуск ----------
  rebuildFilters();
  if (quality.auto && !weakDevice) resize(); else setQuality(quality.level);
  if (params.has("wallpaper")) setWall(true);
  animate();
  storeGet(function (raw) {
    var loaded = load(raw);
    var missing = START.filter(function (s) { return !neurons.some(function (n) { return n.name === s[0]; }); });
    missing.forEach(function (s, i) {
      setTimeout(function () { addNeuron(s[0], "skill", s[1], "Компьютер"); }, 300 + i * (loaded ? 900 : 700));
    });
    window.chloeReady = true;
  });
})();
</script>

<script>
(function () {
  var KEY = "chloe-clean-view", btn = document.getElementById("moreBtn");
  function get() { try { return localStorage.getItem(KEY) !== "0"; } catch (e) { return true; } }
  function set(on) {
    document.body.classList.toggle("clean", on);
    btn.classList.toggle("on", !on);
    btn.title = on ? "Показать все функции" : "Скрыть лишнее";
    btn.textContent = on ? "Все функции" : "Скрыть лишнее";
    try { localStorage.setItem(KEY, on ? "1" : "0"); } catch (e) {}
    window.dispatchEvent(new Event("resize"));
  }
  btn.onclick = function () { set(!document.body.classList.contains("clean")); };
  set(get());
})();

  // ---------- постоянное зрение: Chloe видит экран ----------
  (function () {
    var btn = document.getElementById("seeBtn"), txt = document.getElementById("seeTxt"), on = true;
    function api() { return window.pywebview && window.pywebview.api && window.pywebview.api.vision_get ? window.pywebview.api : null; }
    window.chloeSee = function (title, priv, enabled) {
      on = enabled !== false;
      btn.hidden = false;
      btn.className = !on ? "off" : priv ? "on private" : "on";
      txt.textContent = !on ? "Не смотрю на экран" : priv ? "Приватное окно — не смотрю" : (title ? "Вижу: " + title : "Вижу экран");
      if (on && !priv && title && window.chloeGlance) window.chloeGlance();
      btn.title = on ? "Chloe видит экран (приватные окна пропускает). Нажмите — перестанет смотреть."
                     : "Постоянное зрение выключено. Нажмите — Chloe снова будет видеть экран.";
    };
    btn.onclick = function () {
      var a = api();
      if (!a) return;
      a.vision_set(!on).then(function (v) { window.chloeSee(v ? "" : "", false, v); });
    };
    function init() {
      var a = api();
      if (!a) return;
      a.vision_get().then(function (v) { if (v) window.chloeSee(v.title, v.private, v.on); }).catch(function () {});
    }
    if (api()) init(); else window.addEventListener("pywebviewready", init);
  })();
</script>
